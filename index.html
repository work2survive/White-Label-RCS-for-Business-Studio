<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>White-Label RCS Business Messaging Studio — Template Chooser & Phone Simulator</title>
  <style id="rcs-inline-styles">
/**
 * ============================================================================
 * @fileoverview Stylesheet for the Agnostic RCS Rich Card Template Chooser
 * (`RcsTemplateChooser`) and Mobile Phone Simulator (`RcsPhonePreview`).
 * ============================================================================
 *
 * ARCHITECTURE & STYLING SECTIONS:
 * 1. Studio Design Tokens (`:root`):
 *    Dark-mode workbench palette, typography, semantic status colors (OK, Warn,
 *    Danger), and border radii.
 * 2. Compact 720p Studio Shell Layout (`.rcs-workbench`, `.rcs-workbench-main`):
 *    Two-column CSS Grid (`minmax(420px, 47%) 1fr`) designed to fit inside a
 *    1280×720 viewport while supporting standalone Chooser-Only or Preview-Only
 *    modes.
 * 3. Module 1 — Template & Content Chooser (`.rc-chooser`, `.rc-module-section`):
 *    Vertical-scroll workspace with sticky Quick-Jump Pill Bar and 8 collapsible
 *    accordion modules (`is-collapsed`), character limit meters, and media crop
 *    safe-zone visualizers.
 * 4. Module 2 — Hardware Chassis & OS App Skins (`.rp-phone-chassis`, `.rp-viewport`):
 *    True-to-life 19.5:9 hardware bezels (Google Pixel, Samsung Galaxy, Motorola,
 *    iPhone Dynamic Island, Foldable Dual-Screen), hidden native scrollbars,
 *    Google Messages (Material 3), Samsung Messages (One UI), and iOS 18+ RCS
 *    skins in Light & Dark themes.
 * 5. Custom Touch Cursor & Blue Touch-Area Overlay (`.rp-cursor-follower`,
 *    `.rp-touch-spot`):
 *    Floating hand SVG cursor and glowing 52×52px blue touch indicator when
 *    tapping or dragging inside the simulated phone screen.
 */

:root {
  /* Core Studio Surface Palette */
  --studio-bg: #0f141c;
  --studio-panel: #161d27;
  --studio-panel-elevated: #1d2633;
  --studio-border: #283344;
  --studio-border-subtle: #1f2937;

  /* Studio Typography & Hierarchy Colors */
  --studio-text: #f1f5f9;
  --studio-text-muted: #94a3b8;
  --studio-text-dim: #64748b;

  /* Interactive Accents & Validation Status Tokens */
  --studio-accent: #0284c7;
  --studio-accent-hover: #0369a1;
  --studio-accent-soft: rgba(2, 132, 199, 0.16);
  --studio-ok: #10b981;
  --studio-warn: #f59e0b;
  --studio-danger: #ef4444;
  --studio-radius: 8px;
  --studio-font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--studio-bg);
  color: var(--studio-text);
  font-family: var(--studio-font);
  font-size: 12.5px;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
}

/* ==========================================================================
   Compact 720p Studio Shell Layout
   ========================================================================== */
.rcs-workbench {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-height: 100vh;
  overflow: hidden;
}

.rcs-workbench-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 40px;
  padding: 0 12px;
  background: #0b0f16;
  border-bottom: 1px solid var(--studio-border);
  flex-shrink: 0;
}

.rcs-brand-cluster {
  display: flex;
  align-items: center;
  gap: 8px;
}

.rcs-brand-logo {
  width: 22px;
  height: 22px;
  border-radius: 5px;
  background: var(--studio-accent);
  color: #fff;
  font-weight: 800;
  font-size: 11px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  letter-spacing: -0.5px;
}

.rcs-workbench-header h1 {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--studio-text);
}

.rcs-header-tag {
  font-size: 10.5px;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--studio-panel-elevated);
  color: var(--studio-text-muted);
  border: 1px solid var(--studio-border);
}

.rcs-header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.rcs-mode-switcher {
  display: inline-flex;
  background: var(--studio-panel);
  border: 1px solid var(--studio-border);
  border-radius: 6px;
  padding: 2px;
  gap: 2px;
}

.rcs-mode-btn {
  background: transparent;
  border: none;
  color: var(--studio-text-muted);
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 4px;
  cursor: pointer;
}

.rcs-mode-btn.is-active {
  background: var(--studio-accent);
  color: #fff;
}

/* Main 2-Module Grid (Fits 1280×720 cleanly) */
.rcs-workbench-grid {
  display: grid;
  grid-template-columns: minmax(420px, 47%) 1fr;
  gap: 8px;
  padding: 8px;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

.rcs-workbench-grid.is-mode-chooser-only {
  grid-template-columns: 1fr;
  max-width: 780px;
  margin: 0 auto;
  width: 100%;
}

.rcs-workbench-grid.is-mode-preview-only {
  grid-template-columns: 1fr;
}

.rcs-module-slot {
  display: flex;
  flex-direction: column;
  min-height: 0;
  height: 100%;
  background: var(--studio-panel);
  border: 1px solid var(--studio-border);
  border-radius: var(--studio-radius);
  overflow: hidden;
}

/* ==========================================================================
   Tiny, Color-Neutral Documentation Link Icon
   ========================================================================== */
.rcs-doc-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  color: #78879b;
  background: rgba(148, 163, 184, 0.1);
  border: 1px solid rgba(148, 163, 184, 0.22);
  text-decoration: none;
  vertical-align: middle;
  transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  flex-shrink: 0;
}

.rcs-doc-link:hover {
  color: #cbd5e1;
  background: rgba(148, 163, 184, 0.24);
  border-color: rgba(203, 213, 225, 0.45);
}

.rcs-ico {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 15px;
  height: 15px;
  flex-shrink: 0;
}

.rcs-ico svg {
  width: 100%;
  height: 100%;
}

/* ==========================================================================
   Module 1: RcsTemplateChooser Styles (Spacious Vertical Accordion Layout)
   ========================================================================== */
.rcs-chooser-shell,
.rcs-preview-shell {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}

.rcs-chooser-topbar,
.rcs-preview-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 14px;
  background: linear-gradient(180deg, #151d28 0%, #111722 100%);
  border-bottom: 1px solid var(--studio-border);
  flex-shrink: 0;
  flex-wrap: wrap;
}

.rcs-module-title {
  display: flex;
  align-items: center;
  gap: 8px;
}

.rcs-module-badge {
  font-size: 10px;
  font-weight: 800;
  padding: 3px 6px;
  border-radius: 4px;
  background: rgba(2, 132, 199, 0.22);
  color: #38bdf8;
  letter-spacing: 0.04em;
}

.rcs-module-badge.is-preview {
  background: rgba(16, 185, 129, 0.18);
  color: #34d399;
}

.rcs-module-title h2 {
  margin: 0;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--studio-text);
  letter-spacing: -0.01em;
}

.rcs-preset-select-pill {
  background: #1a2433 !important;
  border-color: #2f3e53 !important;
  padding: 6px 10px !important;
  font-weight: 600;
  border-radius: 7px !important;
}

/* Sticky Quick-Jump & Accordion Control Bar */
.rcs-Subnav-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 14px;
  background: #111721;
  border-bottom: 1px solid var(--studio-border);
  flex-shrink: 0;
}

.rcs-jump-pills {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 1px;
}

.rcs-jump-pills::-webkit-scrollbar {
  display: none;
}

.rcs-jump-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  background: #18212f;
  border: 1px solid #283548;
  border-radius: 999px;
  color: #cbd5e1;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
}

.rcs-jump-pill:hover {
  background: rgba(2, 132, 199, 0.16);
  border-color: #38bdf8;
  color: #fff;
  transform: translateY(-1px);
}

.rcs-fold-controls {
  flex-shrink: 0;
}

.rcs-fold-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  background: rgba(148, 163, 184, 0.08);
  border: 1px solid #2c3a4f;
  border-radius: 6px;
  color: #94a3b8;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
}

.rcs-fold-btn:hover {
  color: #f8fafc;
  background: rgba(148, 163, 184, 0.16);
  border-color: #475569;
}

.rcs-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

.rcs-dot.is-detected {
  background: var(--studio-ok);
}

.rcs-dot.is-fallback {
  background: var(--studio-warn);
}

/* Vertically Scrollable Chooser Body with Generous Breathing Room */
.rcs-chooser-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 16px 32px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scroll-behavior: smooth;
  scrollbar-width: thin;
  scrollbar-color: #334155 #0f151e;
}

.rcs-chooser-body::-webkit-scrollbar {
  width: 8px;
}

.rcs-chooser-body::-webkit-scrollbar-track {
  background: #0f151e;
}

.rcs-chooser-body::-webkit-scrollbar-thumb {
  background: #2d3b4e;
  border-radius: 999px;
  border: 2px solid #0f151e;
}

.rcs-chooser-body::-webkit-scrollbar-thumb:hover {
  background: #475569;
}

/* Collapsible Accordion Module Cards */
.rcs-panel-section.rcs-accordion-card {
  background: linear-gradient(180deg, #161f2c 0%, #121822 100%);
  border: 1px solid #263244;
  border-radius: 11px;
  padding: 0;
  display: flex;
  flex-direction: column;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
  flex-shrink: 0;
}

.rcs-panel-section.rcs-accordion-card:hover {
  border-color: #33435a;
}

.rcs-panel-section.rcs-accordion-card.is-highlighted {
  border-color: #38bdf8;
  box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.28), 0 8px 24px rgba(0, 0, 0, 0.35);
}

.rcs-accordion-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 13px 16px;
  cursor: pointer;
  user-select: none;
  border-radius: 11px;
  transition: background 0.15s ease;
}

.rcs-accordion-head:hover {
  background: rgba(255, 255, 255, 0.025);
}

.rcs-accordion-head-left {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}

.rcs-mod-icon-box {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: rgba(2, 132, 199, 0.14);
  border: 1px solid rgba(56, 189, 248, 0.24);
  color: #38bdf8;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.rcs-mod-icon-box .rcs-ico {
  width: 17px;
  height: 17px;
}

.rcs-mod-title-stack {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.rcs-mod-title-row {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.rcs-mod-step {
  font-size: 10px;
  font-weight: 800;
  color: #64748b;
  background: rgba(15, 23, 42, 0.65);
  border: 1px solid #263244;
  padding: 1px 5px;
  border-radius: 4px;
  letter-spacing: 0.04em;
}

.rcs-section-title {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 700;
  color: #f1f5f9;
  letter-spacing: -0.01em;
}

.rcs-mod-summary-pill {
  font-size: 11px;
  color: #94a3b8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 360px;
}

.rcs-accordion-head-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.rcs-accordion-chevron {
  width: 26px;
  height: 26px;
  border-radius: 6px;
  background: rgba(148, 163, 184, 0.08);
  color: #94a3b8;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s ease, background 0.15s ease, color 0.15s ease;
}

.rcs-accordion-head:hover .rcs-accordion-chevron {
  background: rgba(148, 163, 184, 0.16);
  color: #f1f5f9;
}

.rcs-accordion-card.is-collapsed .rcs-accordion-chevron {
  transform: rotate(-90deg);
}

.rcs-accordion-body {
  padding: 14px 16px 18px;
  border-top: 1px solid rgba(148, 163, 184, 0.1);
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.rcs-accordion-card.is-collapsed .rcs-accordion-body {
  display: none;
}

/* Module 01: Visual Template Grid (3×2 Cards) */
.rcs-template-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 10px;
}

.rcs-tpl-card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  padding: 11px 12px;
  background: #182230;
  border: 1px solid #29374b;
  border-radius: 9px;
  color: var(--studio-text-muted);
  cursor: pointer;
  text-align: left;
  transition: all 0.16s ease;
}

.rcs-tpl-card:hover {
  border-color: #475569;
  background: #1d293a;
  color: var(--studio-text);
  transform: translateY(-1px);
}

.rcs-tpl-card.is-active {
  background: linear-gradient(180deg, rgba(2, 132, 199, 0.22) 0%, rgba(2, 132, 199, 0.1) 100%);
  border-color: #38bdf8;
  color: #fff;
  box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.25);
}

.rcs-tpl-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
}

.rcs-tpl-card-ico {
  width: 30px;
  height: 30px;
  border-radius: 7px;
  background: rgba(15, 23, 42, 0.55);
  border: 1px solid rgba(148, 163, 184, 0.16);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #38bdf8;
  flex-shrink: 0;
}

.rcs-tpl-ico {
  width: 18px;
  height: 18px;
  display: inline-flex;
}

.rcs-tpl-card-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  min-width: 0;
}

.rcs-tpl-name {
  font-size: 12px;
  font-weight: 700;
  color: #f1f5f9;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rcs-tpl-channel-tag {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.05em;
  padding: 1px 5px;
  border-radius: 3px;
  width: fit-content;
}

.rcs-tpl-channel-tag.is-rcs {
  background: rgba(56, 189, 248, 0.15);
  color: #38bdf8;
}

.rcs-tpl-channel-tag.is-sms {
  background: rgba(245, 158, 11, 0.16);
  color: #fbbf24;
}

.rcs-tpl-card-desc {
  margin: 0;
  font-size: 11px;
  line-height: 1.38;
  color: #94a3b8;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Module 02: Carousel / Multi-Card Visual Deck */
.rcs-card-deck-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
  gap: 8px;
}

.rcs-deck-card-pill {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  background: #182230;
  border: 1px solid #29374b;
  border-radius: 8px;
  color: var(--studio-text-muted);
  cursor: pointer;
  text-align: left;
  transition: all 0.15s ease;
}

.rcs-deck-card-pill:hover {
  border-color: #475569;
  background: #1e2a3b;
  color: var(--studio-text);
}

.rcs-deck-card-pill.is-active {
  background: rgba(2, 132, 199, 0.18);
  border-color: #38bdf8;
  color: #fff;
  box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.25);
}

.rcs-deck-thumb {
  width: 38px;
  height: 38px;
  border-radius: 6px;
  background-color: #0d131c;
  background-size: cover;
  background-position: center;
  border: 1px solid rgba(255, 255, 255, 0.12);
  position: relative;
  flex-shrink: 0;
}

.rcs-deck-index {
  position: absolute;
  bottom: -3px;
  right: -3px;
  background: #0284c7;
  color: #fff;
  font-size: 9.5px;
  font-weight: 800;
  padding: 1px 4px;
  border-radius: 4px;
}

.rcs-deck-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.rcs-deck-title {
  font-size: 11.5px;
  font-weight: 700;
  color: #f1f5f9;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rcs-deck-sub {
  font-size: 10px;
  color: #94a3b8;
}

.rcs-card-actions {
  display: flex;
  gap: 6px;
}

/* Module 03: Geometry & Safe-Zone Crop Controls */
.rcs-geometry-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 12px;
}

.rcs-segmented {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(56px, 1fr));
  gap: 4px;
  background: #0f151e;
  padding: 4px;
  border-radius: 8px;
  border: 1px solid #263244;
}

.rcs-seg-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 6px 8px;
  background: transparent;
  border: none;
  border-radius: 6px;
  color: var(--studio-text-muted);
  cursor: pointer;
  font-size: 11px;
  transition: all 0.14s ease;
}

.rcs-seg-btn:hover {
  color: #f1f5f9;
  background: rgba(255, 255, 255, 0.04);
}

.rcs-seg-btn small {
  font-size: 10px;
  opacity: 0.78;
}

.rcs-seg-btn.is-active {
  background: var(--studio-accent);
  color: #fff;
  box-shadow: 0 2px 6px rgba(2, 132, 199, 0.35);
}

/* Crop Diagnostic Box */
.rcs-crop-diagnostic {
  display: grid;
  grid-template-columns: 148px 1fr;
  gap: 14px;
  align-items: center;
  background: #101722;
  border: 1px solid #243042;
  border-radius: 9px;
  padding: 12px;
}

.rcs-crop-minimap {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #090d12;
  border-radius: 6px;
  height: 104px;
  padding: 6px;
  overflow: hidden;
  border: 1px solid #1e293b;
}

.rcs-crop-stage {
  position: relative;
  max-width: 100%;
  max-height: 100%;
  width: 100%;
  background-size: cover;
  background-position: center;
  border-radius: 4px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px dashed rgba(239, 68, 68, 0.75);
}

.rcs-crop-mask {
  border: 1.5px solid #22c55e;
  background: rgba(34, 197, 94, 0.14);
  box-shadow: 0 0 0 999px rgba(239, 68, 68, 0.42);
  display: flex;
  align-items: center;
  justify-content: center;
}

.rcs-crop-safe-tag {
  font-size: 8.5px;
  font-weight: 800;
  color: #fff;
  background: rgba(15, 23, 42, 0.84);
  padding: 2px 5px;
  border-radius: 3px;
  letter-spacing: 0.03em;
}

.rcs-crop-stats {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.rcs-spec-pill {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-size: 11.5px;
  gap: 8px;
  padding-bottom: 4px;
  border-bottom: 1px dashed rgba(148, 163, 184, 0.1);
}

.rcs-spec-k {
  color: var(--studio-text-muted);
}

.rcs-spec-v {
  color: var(--studio-text);

.rcs-stage-wrap::-webkit-scrollbar,
.rcs-preview-shell::-webkit-scrollbar,

/* Exact Scaled Bounding Box for the Hardware Frame (Prevents Flexbox Width Compression) */
.rcs-phone-scale-container {
  position: relative;
  display: block;
  flex-shrink: 0;
  margin: auto;
}

/* Phone Physical Bezel & Screen Variables (Locked 1:1 to device.width × device.height before uniform scale) */
.rcs-phone-hardware {
  position: absolute;
  top: 0;
  left: 0;
  flex-shrink: 0;
  transform: scale(var(--phone-scale, 0.65));
  transform-origin: top left;
  background: var(--header-bg, #e7f0ed);
  color: var(--app-text, #191c1b);
  border: 10px solid #1e242d;
  box-shadow:
    0 0 0 2px #3b4454,
    0 20px 50px rgba(0, 0, 0, 0.65);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
  cursor: url("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"), none !important;
  font-family: 'Google Sans', 'Roboto', system-ui, -apple-system, sans-serif;
}

.rcs-phone-hardware * {
  cursor: url("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"), none !important;
}

/* Theme Palettes (Calibrated to Motorola Edge 50 Pro Google Messages Material You Teal Palette) */

.rcs-agent-hero-logo {
  width: 72px;
  height: 72px;
  object-fit: cover;
  margin-bottom: 12px;
  border-radius: 50%;
}

.rcs-agent-hero-logo.is-rounded,
.rcs-agent-hero-logo.is-circle {
  border-radius: 50%;
}

.rcs-agent-hero-title {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 20px;
  font-weight: 400;
  color: var(--app-text);
  margin-bottom: 6px;
}

.rcs-agent-hero-tagline {
  margin: 0;
  font-size: 13px;
  line-height: 1.42;
  color: var(--app-text-sub);
  max-width: 310px;
}

.rcs-chat-timestamp,
.rcs-chat-system-notice {
  text-align: center;
  font-size: 11.5px;
  font-weight: 400;
  color: var(--app-text-sub);
  margin: 2px 0;
}

.rcs-chat-timestamp.is-inter-card {
  margin: 6px 0 2px;
}

/* Teal "Unread" Horizontal Divider (Matches GB Žilina Screenshot_20261106-104406_Messages.png) */
.rcs-unread-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 6px 2px 4px;
  color: var(--verified-color);
  font-size: 11.5px;
  font-weight: 500;
}

.rcs-unread-divider::before,
.rcs-unread-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--verified-color);
  opacity: 0.65;
}

/* Message Container & Rich Card (Exact Motorola Edge 50 Pro 8dp side margin & 20dp corner radius) */
.rcs-message-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.rcs-stacked-cards-feed {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.rcs-rich-card {
  background: var(--card-bg);
  border-radius: 20px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  animation: rcsBubbleIn 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}

/* Samsung One UI Skin Variation */
.rcs-phone-hardware.is-skin-samsung_messages_oneui .rcs-rich-card {
  border-radius: 22px;
  border: 1px solid var(--app-border);
}

/* Apple iOS 18 Skin Variation */
.rcs-phone-hardware.is-skin-ios_18_messages .rcs-rich-card {
  border-radius: 20px;
}

.rcs-card-media-wrap {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #cbd5e1;
  cursor: url("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"), none !important;
}

.rcs-card-media-el {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}

.rcs-media-type-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(15, 23, 42, 0.78);
  color: #fff;
  font-size: 9.5px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 4px;
}

/* Safe-Zone Crop Guide Overlay inside Phone Preview */
.rcs-preview-crop-overlay {
  position: absolute;
  inset: 0;
  border: 1.5px dashed rgba(245, 158, 11, 0.75);
  display: flex;
  align-items: flex-end;
  justify-content: flex-end;
  padding: 6px;
  pointer-events: none;
}

.rcs-preview-crop-safe {
  background: rgba(15, 23, 42, 0.82);
  color: #fbbf24;
  font-size: 9.5px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
}

/* Card Content Padding & Typography (Matched to Motorola Edge 50 Pro 16dp horizontal padding) */
.rcs-card-content {
  padding: 15px 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.rcs-card-title {
  margin: 0;
  font-size: 15.5px;
  font-weight: 500;
  line-height: 1.34;
  letter-spacing: 0;
  color: var(--app-text);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.rcs-card-desc {
  font-size: 14px;
  font-weight: 400;
  line-height: 1.43;
  color: var(--app-text);
  word-break: break-word;
}

.rcs-more-link {
  background: none;
  border: none;
  color: var(--verified-color);
  font-weight: 600;
  font-size: 13px;
  cursor: url("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"), none !important;
  padding: 0 4px;
}

/* Segmented Material 3 Expressive Action Buttons (Exact match to Motorola Edge 50 Pro screenshots!) */
.rcs-card-actions-stack {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: 6px;
}

.rcs-card-action-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 8px 16px 8px 14px;
  background: var(--action-btn-bg);
  color: var(--app-text);
  border: none;
  border-radius: 18px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 400;
  text-align: left;
  cursor: url("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"), none !important;
  transition: transform 0.1s ease, filter 0.12s ease;
}

/* Quick Reply rows in Google Messages M3 have no left icon circle and left-align text at 16px padding */
.rcs-card-action-btn.is-reply-row {
  padding-left: 16px;
}

/* Material 3 Expressive Grouped Button Corner Radii (18px outer corners, 5px inner adjacent corners) */
.rcs-card-action-btn:only-child {
  border-radius: 18px;
}

.rcs-card-action-btn:first-child:not(:only-child) {
  border-radius: 18px 18px 5px 5px;
}

.rcs-card-action-btn:not(:first-child):not(:last-child) {
  border-radius: 5px;
}

.rcs-card-action-btn:last-child:not(:only-child) {
  border-radius: 5px 5px 18px 18px;
}

.rcs-card-action-btn:hover {
  filter: brightness(0.97);
}

.rcs-card-action-btn:active {
  transform: scale(0.985);
}

.rcs-action-circle-ico {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--action-ico-bg);
  color: var(--app-text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.rcs-action-label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Rich Card Carousel (With peeking neighbor cards) */
.rcs-carousel-track {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin: 0 -8px;
  padding: 2px 34px 4px;
  scroll-snap-type: x mandatory;
  cursor: url("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"), none !important;
  scrollbar-width: none;
}

.rcs-carousel-track::-webkit-scrollbar {
  display: none;
}

.rcs-carousel-track.is-dragging {
  cursor: url("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"), none !important;
  scroll-snap-type: none;
}

.rcs-rich-card.is-carousel-item {
  width: var(--carousel-card-w, 264px);
  min-width: var(--carousel-card-w, 264px);
  flex-shrink: 0;
  scroll-snap-align: center;
  justify-content: space-between;
}

.rcs-rich-card.is-carousel-item .rcs-card-content {
  flex: 1;
  justify-content: space-between;
}

/* Horizontal Rich Card (Left / Right Side Thumbnail) */
.rcs-rich-card.is-horizontal {
  padding: 14px;
  gap: 10px;
}

.rcs-horiz-top {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.rcs-rich-card.is-align-right .rcs-horiz-top {
  flex-direction: row-reverse;
}

.rcs-horiz-thumb {
  position: relative;
  width: 106px;
  height: 118px;
  border-radius: 14px;
  overflow: hidden;
  flex-shrink: 0;
  cursor: url("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"), none !important;
}

.rcs-horiz-copy {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

/* Conversational Text + Floating Suggestion Chips */
.rcs-plain-rcs-bubble {
  background: var(--card-bg);
  padding: 11px 15px;
  border-radius: 20px 20px 20px 6px;
  max-width: 88%;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.rcs-chips-scroll {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 6px 2px 2px;
}

.rcs-floating-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 18px;
  background: var(--action-btn-bg);
  border: 1px solid var(--app-border);
  color: var(--app-text);
  font-size: 13.5px;
  font-weight: 400;
  white-space: nowrap;
  cursor: url("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"), none !important;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}

/* SMS Fallback Bubble */
.rcs-sms-bubble-card {
  background: var(--card-bg);
  padding: 12px 15px;
  border-radius: 20px 20px 20px 4px;
  max-width: 90%;
  border-left: 3px solid #f59e0b;
}

.rcs-sms-text {
  font-size: 14px;
  line-height: 1.43;
  color: var(--app-text);
}

.rcs-sms-meta-tag {
  margin-top: 6px;
  font-size: 10.5px;
  color: var(--app-text-sub);
  font-weight: 600;
}

.rcs-msg-delivery-time {
  font-size: 11px;
  color: var(--app-text-sub);
  padding-left: 12px;
}

/* Interactive User / Agent Reply Bubbles (Matches Dentalia #006a64 Teal User Bubbles) */
.rcs-chat-bubble-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
  animation: rcsBubbleIn 0.25s cubic-bezier(0.22, 1, 0.36, 1);
}

.rcs-chat-bubble-row.is-user {
  align-items: flex-end;
}

.rcs-chat-bubble-row.is-agent {
  align-items: flex-start;
}

.rcs-chat-bubble {
  max-width: 82%;
  padding: 10px 15px;
  border-radius: 20px;
  font-size: 14px;
  line-height: 1.4;
}

.rcs-chat-bubble.is-user {
  background: var(--user-bubble-bg, #006a64);
  color: #ffffff;
  border-bottom-right-radius: 6px;
}

.rcs-chat-bubble.is-agent {
  background: var(--card-bg);
  color: var(--app-text);
  border-bottom-left-radius: 6px;
}

.rcs-bubble-time {
  font-size: 10.5px;
  color: var(--app-text-sub);
  padding: 0 6px;
}

/* Animated Typing Indicator */
.rcs-typing-indicator {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--card-bg);
  padding: 10px 14px;
  border-radius: 16px;
  width: fit-content;
}

.rcs-typing-indicator span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--app-text-sub);
  animation: rcsTypingBounce 1.1s infinite ease-in-out;
}

.rcs-typing-indicator span:nth-child(2) { animation-delay: 0.18s; }
.rcs-typing-indicator span:nth-child(3) { animation-delay: 0.36s; }

/* Floating Scroll-to-Bottom Button */
.rcs-floating-scroll-btn {
  position: absolute;
  bottom: 76px;
  left: 50%;
  transform: translateX(-50%);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--action-btn-bg);
  color: var(--app-text);
  border: 1px solid var(--app-border);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: url("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"), none !important;
  z-index: 15;
}

/* 4. Bottom Chrome Wrapper (Keeps Spam Banner + Compose Bar + Gesture Bar on --app-bg #f3fbf9) */
.rcs-bottom-chrome-wrap {
  background: var(--app-bg);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

/* Spam & Safety Shield Banner (Exact match to Motorola Edge 50 Pro Screenshot_20261106-104611_Messages.png) */
.rcs-spam-shield-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 2px 34px 6px;
  min-height: 52px;
  padding: 8px 14px;
  background: var(--card-bg);
  border-radius: 26px;
  font-size: 12px;
  line-height: 1.32;
  color: var(--app-text);
  flex-shrink: 0;
}

.rcs-shield-ico {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--verified-color);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.rcs-shield-ico .rcs-ico {
  width: 15px;
  height: 15px;
}

.rcs-shield-text {
  flex: 1;
}

.rcs-shield-link {
  color: var(--app-text);
  text-decoration: underline;
  font-weight: 500;
}

.rcs-shield-close {
  background: none;
  border: none;
  color: var(--app-text-sub);
  font-size: 14px;
  padding: 2px 4px;
  cursor: url("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"), none !important;
}

/* Bottom Compose Bar (Exact match to Motorola Edge 50 Pro 52dp pill + 52dp #cfe5ff Voice FAB) */
.rcs-compose-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 8px 6px;
  background: var(--app-bg);
  flex-shrink: 0;
}

.rcs-google-input-pill {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  height: 52px;
  padding: 0 12px;
  background: var(--card-bg);
  border-radius: 26px;
}

.rcs-compose-ico-btn {
  background: none;
  border: none;
  color: var(--app-text-sub);
  padding: 2px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: url("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"), none !important;
}

.rcs-compose-input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: var(--app-text);
  font-size: 14px;
  font-weight: 400;
  font-family: inherit;
}

.rcs-compose-input::placeholder {
  color: var(--app-text-sub);
}

.rcs-voice-fab {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--voice-fab-bg);
  color: var(--voice-fab-fg);
  border: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: url("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"), none !important;
  flex-shrink: 0;
}

/* iOS Compose Bar */
.rcs-compose-bar.is-ios {
  padding: 6px 12px;
}

.rcs-ios-plus-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--app-surface);
  border: none;
  color: var(--app-text-sub);
  font-size: 20px;
  cursor: url("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"), none !important;
}

.rcs-ios-input-pill {
  flex: 1;
  display: flex;
  align-items: center;
  height: 34px;
  padding: 0 12px;
  border-radius: 18px;
  border: 1px solid var(--app-border);
  background: var(--app-bg);
}

/* 5. Bottom Gesture Bar */
.rcs-os-gesture-bar {
  height: 16px;
  background: var(--app-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.rcs-gesture-pill {
  width: 108px;
  height: 4px;
  border-radius: 2px;
  background: var(--app-text);
  opacity: 0.65;
}

/* In-Phone Modal Overlays (Lightbox / Webview / Custom Preset) */
.rcs-phone-modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(9, 13, 20, 0.76);
  z-index: 40;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: rcsFadeIn 0.16s ease;
}

.rcs-lightbox-sheet,
.rcs-action-sheet {
  width: 100%;
  background: var(--app-bg);
  color: var(--app-text);
  border-radius: 20px 20px 0 0;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 85%;
}

.rcs-sheet-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13.5px;
  font-weight: 600;
}

.rcs-sheet-close {
  background: var(--app-surface);
  border: none;
  color: var(--app-text);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  cursor: url("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"), none !important;
}

.rcs-lightbox-img {
  width: 100%;
  max-height: 420px;
  object-fit: contain;
  border-radius: 10px;
  background: #000;
}

.rcs-lightbox-foot {
  font-size: 11px;
  color: var(--app-text-sub);
  text-align: center;
}

.rcs-webview-url-bar {
  background: var(--app-surface);
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 11.5px;
  color: var(--app-text-sub);
  font-family: monospace;
}

.rcs-webview-sim {
  padding: 20px 12px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.rcs-webview-icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--action-ico-bg);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Bottom Telemetry / Tracking Status Bar (Future Reporting System Integration) */
.rcs-telemetry-footer {
  height: 28px;
  padding: 0 12px;
  background: #0b0f16;
  border-top: 1px solid var(--studio-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--studio-text-muted);
  flex-shrink: 0;
}

.rcs-telemetry-stream {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  white-space: nowrap;
}

.rcs-telemetry-badge {
  color: #34d399;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.rcs-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
}

@keyframes rcsBubbleIn {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes rcsTypingBounce {
  0%, 80%, 100% { transform: scale(0.75); opacity: 0.45; }
  40% { transform: scale(1.1); opacity: 1; }
}

@keyframes rcsFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.rcs-carousel-intro-bubble {
  margin-bottom: 6px;
  max-width: 94%;
  font-size: 13.5px;
  line-height: 1.4;
}

.rcs-carousel-nav-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 2px 0 4px;
}

.rcs-carousel-step-btn {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1px solid var(--app-border);
  background: var(--app-surface);
  color: var(--app-text);
  font-size: 15px;
  font-weight: 700;
  line-height: 1;
  cursor: url("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"), none !important;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.rcs-carousel-step-btn:hover {
  background: var(--app-surface-2);
}

.rcs-carousel-dots {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.rcs-carousel-dot {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1px solid var(--app-border);
  background: var(--app-surface);
  color: var(--app-text-sub);
  font-size: 10px;
  font-weight: 700;
  cursor: url("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"), none !important;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.rcs-carousel-dot:hover {
  background: var(--verified-color);
  color: #ffffff;
  border-color: var(--verified-color);
}

.rcs-slot-picker-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-top: 6px;
}

.rcs-slot-chip-btn {
  padding: 9px 8px;
  border-radius: 12px;
  border: 1px solid var(--verified-color);
  background: var(--app-surface);
  color: var(--app-text);
  font-size: 12px;

  transition: all 0.12s ease;
}

.rcs-slot-chip-btn:hover {
  background: var(--verified-color);
  color: #ffffff;
}

/* ==========================================================================
   Custom Hand Cursor, Tapping Hand Icon, & Blue Touch-Area Overlay
   ========================================================================== */
.rcs-touch-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 90;
  overflow: hidden;
  opacity: 0;
  transition: opacity 0.12s ease;
}

.rcs-touch-overlay.is-visible {
  opacity: 1;
}

/* Blue Circular Overlay in the Screen Area Being Touched */
.rcs-touch-blue-area {
  position: absolute;
  width: 52px;
  height: 52px;
  margin-left: -26px;
  margin-top: -26px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(14, 165, 233, 0.46) 0%, rgba(2, 132, 199, 0.22) 70%, rgba(2, 132, 199, 0) 100%);
  border: 2px solid rgba(56, 189, 248, 0.92);
  box-shadow: 0 0 16px rgba(14, 165, 233, 0.55);
  transform: scale(0.35);
  opacity: 0;
  transition: transform 0.12s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.12s ease;
  pointer-events: none;
}

.rcs-touch-overlay.is-tapping .rcs-touch-blue-area {
  transform: scale(1);
  opacity: 1;
}

/* Expanding Blue Ripple on Tap */
.rcs-touch-ripple {
  position: absolute;
  width: 54px;
  height: 54px;
  margin-left: -27px;
  margin-top: -27px;
  border-radius: 50%;
  background: rgba(14, 165, 233, 0.36);
  border: 2px solid rgba(56, 189, 248, 0.9);
  pointer-events: none;
  animation: rcsTouchRipple 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Custom Hand Cursor Following the Pointer (Index Fingertip Aligned at x,y) */
.rcs-touch-cursor {
  position: absolute;
  width: 32px;
  height: 32px;
  margin-left: -14px;
  margin-top: -4px;
  pointer-events: none;
  filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.42));
  transition: transform 0.09s ease;
}

.rcs-hand-svg.is-tap-hand {
  display: none;
}

.rcs-touch-overlay.is-tapping .rcs-hand-svg.is-hover-hand {
  display: none;
}

.rcs-touch-overlay.is-tapping .rcs-hand-svg.is-tap-hand {
  display: block;
}

.rcs-touch-overlay.is-tapping .rcs-touch-cursor {
  transform: translateY(2px) scale(0.92) rotate(-8deg);
}

@keyframes rcsTouchRipple {
  0% {
    transform: scale(0.5);
    opacity: 0.95;
  }
  100% {
    transform: scale(1.65);
    opacity: 0;
  }
}

/**
 * Analyzes an SMS fallback message string to determine its character encoding (`GSM-7` vs `UCS-2`),
 * total character count, number of billable SMS segments, and remaining characters in the current segment.
 *
 * Encoding Rules:
 * - **GSM-7**: Standard 7-bit alphabet. Supports up to `160` chars in a single SMS, or `153` chars
 *   per segment in concatenated multi-part SMS (7 bytes reserved for UDH concatenation header).
 * - **UCS-2 (Unicode)**: Triggered automatically if any non-GSM-7 character (e.g. emojis, Slovak/Czech
 *   diacritics like `č, š, ž, ť, ľ, á, í, ý`) is present. Supports `70` chars in a single SMS, or
 *   `67` chars per concatenated segment.
 *
 * @param {string} [text=''] - The raw SMS fallback text to analyze.
 * @returns {{
 *   encoding: string,
 *   length: number,
 *   segments: number,
 *   singleLimit: number,
 *   multiLimit: number,
 *   remaining: number
 * }}
 */
function analyzeSmsSegments(text = '') {
  // Regular expression matching the standard 7-bit GSM 03.38 character set
  const gsm7Regex = /^[@£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ !"#¤%&'()*+,\-./0-9:;<=>?¡A-ZÄÖÑÜ§¿a-zäöñüà^{}\\[~\]|€]*$/;
  const isGsm7 = gsm7Regex.test(text);
  // Count Unicode code points accurately using Array.from()
  const length = Array.from(text).length;
  const singleLimit = isGsm7 ? TEXT_LIMITS.smsFallback.gsmSingle : TEXT_LIMITS.smsFallback.ucsSingle;
  const multiLimit = isGsm7 ? TEXT_LIMITS.smsFallback.gsmMulti : TEXT_LIMITS.smsFallback.ucsMulti;
  const segments = length === 0 ? 0 : length <= singleLimit ? 1 : Math.ceil(length / multiLimit);
  const remaining = length <= singleLimit
    ? singleLimit - length
    : (segments * multiLimit) - length;

  return {
    encoding: isGsm7 ? 'GSM-7' : 'UCS-2 (Unicode)',
    length,
    segments,
    singleLimit,
    multiLimit,
    remaining
  };
}

/**
 * Evaluates how a mobile RCS client (Google Messages, Samsung Messages, Apple Messages) will
 * center-crop (`object-fit: cover`) an uploaded image, GIF, or video inside a Rich Card media slot.
 *
 * Geometry Calculation:
 * - For **Standalone Vertical Cards**, the target aspect ratio is defined by `MEDIA_SPECS[mediaHeightKey]`
 *   (`SHORT` = 112dp, `MEDIUM` = 168dp, `TALL` = 264dp).
 * - For **Carousel Cards**, each card has a constrained width (`SMALL` = 186px effective / 120dp spec,
 *   `MEDIUM` = 264px effective / 200dp spec) paired with the selected `mediaHeightKey` (`112dp`, `168dp`, `264dp`),
 *   yielding a tighter effective aspect ratio (`cWidth / cHeight`).
 * - Compares `srcRatio` (`srcW / srcH`) against `targetRatio` to determine whether the **horizontal**
 *   (left/right edges) or **vertical** (top/bottom edges) axis will be cropped and by what percentage.
 *
 * @param {{ width?: number, height?: number }} dimensions - Pixel dimensions of the source media asset.
 * @param {'SHORT'|'MEDIUM'|'TALL'|'HORIZONTAL'} [mediaHeightKey='MEDIUM'] - Selected RBM media height slot.
 * @param {boolean} [isCarousel=false] - True when rendering inside a Rich Card Carousel.
 * @param {'SMALL'|'MEDIUM'} [cardWidthKey='MEDIUM'] - Selected Carousel card width.
 * @returns {{
 *   spec: Object,
 *   srcW: number,
 *   srcH: number,
 *   srcRatio: number,
 *   targetRatio: number,
 *   cropAxis: 'none'|'horizontal'|'vertical',
 *   visibleFraction: number,
 *   croppedPercent: number,
 *   recText: string
 * }}
 */
function evaluateMediaCrop(dimensions, mediaHeightKey = 'MEDIUM', isCarousel = false, cardWidthKey = 'MEDIUM') {
  const spec = MEDIA_SPECS[mediaHeightKey] || MEDIA_SPECS.MEDIUM;
  let targetRatio = spec.aspectRatio;

  // In a Carousel, card width is narrower than a full-width standalone card, changing the effective media aspect ratio
  if (isCarousel) {
    const cWidth = CAROUSEL_WIDTH_SPECS[cardWidthKey]?.dpWidth || 264;
    const cHeight = spec.dpHeight || 168;
    targetRatio = cWidth / cHeight;
  }

  const srcW = dimensions?.width || spec.recWidthPx;
  const srcH = dimensions?.height || spec.recHeightPx;
  const srcRatio = srcW / srcH;

  let cropAxis = 'none';
  let visibleFraction = 1;
  let croppedPercent = 0;

  // Allow a 3% tolerance before flagging horizontal or vertical edge cropping
  if (Math.abs(srcRatio - targetRatio) > 0.03) {
    if (srcRatio > targetRatio) {
      // Source image is wider than the RCS media container -> left & right edges are center-cropped
      cropAxis = 'horizontal';
      visibleFraction = targetRatio / srcRatio;
    } else {
      // Source image is taller than the RCS media container -> top & bottom edges are center-cropped
      cropAxis = 'vertical';
      visibleFraction = srcRatio / targetRatio;
    }
    croppedPercent = Math.round((1 - visibleFraction) * 100);
  }

  return {
    spec,
    srcW,
    srcH,
    srcRatio,
    targetRatio,
    cropAxis,
    visibleFraction,
    croppedPercent,
    recText: `${spec.recWidthPx}×${spec.recHeightPx}px (${spec.aspectLabel}) • max ${Math.round(spec.maxImageKb / 1024 * 10) / 10}MB`
  };
}

/**
 * Renders a tiny, color-neutral (`#78879b`) documentation badge (`15×15px`) that links
 * directly to the official Google RCS for Business (RBM) documentation for the adjacent UI control.
 *
 * Note: `onclick="event.stopPropagation()"` is attached so clicking a documentation link inside
 * a collapsible accordion header or template button opens the doc in a new tab without toggling
 * the parent control.
 *
 * @param {string} url - Official Google RBM developer documentation URL.
 * @param {string} [tooltip='Official Google RCS API Documentation'] - Hover tooltip explaining the spec.
 * @returns {string} HTML anchor string.
 */
function renderDocLink(url, tooltip = 'Official Google RCS API Documentation') {
  const safeTitle = String(tooltip).replace(/"/g, '&quot;');
  return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="rcs-doc-link" title="${safeTitle}" aria-label="${safeTitle}" onclick="event.stopPropagation()">
    <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="8" cy="8" r="6.2"/>
      <path d="M8 7.2v4.2M8 4.8h.01" stroke-linecap="round"/>
    </svg>
  </a>`;
}

/**
 * Returns an inline `<span>` wrapper containing the requested SVG pictogram.
 * Falls back gracefully to the `'globe'` icon if an unknown icon key is passed.
 *
 * @param {string} name - Key in `ICONS`.
 * @param {string} [className='rcs-ico'] - CSS class applied to the outer span.
 * @returns {string} HTML span string.
 */
function getIcon(name, className = 'rcs-ico') {
  const svg = ICONS[name] || ICONS['globe'];
  return `<span class="${className}" aria-hidden="true">${svg}</span>`;
}


/**
 * @fileoverview Agnostic RCS Template Chooser & Content/Agent Configurator Module (`src/modules/template-chooser.js`)
 *
 * Key Capabilities & Architecture:
 * --------------------------------
 * 1. **Standalone & Framework-Agnostic**:
 *    - Mountable in any DOM container via `new RcsTemplateChooser(el, options)` or as a native
 *      Web Component `<rcs-template-chooser>`.
 *    - Zero coupling to `RcsPhonePreview`; communicates exclusively via standard DOM `CustomEvent`s
 *      (`rcs:change`, `rcs:flow-action`) and optional callback hooks (`onChange`, `onTriggerFlow`).
 *
 * 2. **Spacious Vertical Scroll with Collapsible Accordion Modules**:
 *    - Organizes all RCS/SMS configuration steps into 8 self-contained, collapsible accordion cards
 *      (`templates`, `cards`, `media`, `copy`, `actions`, `agent`, `fallback`, `json`).
 *    - Each module header displays a step badge (`01`–`08`), title, official Google RBM documentation
 *      link (`renderDocLink`), a live summary pill (visible even when collapsed), and a chevron toggle.
 *    - Includes a sticky Quick-Jump bar to smoothly scroll to and auto-expand any section, plus a
 *      1-click `Collapse All` / `Expand All` button.
 *
 * 3. **Real-Time Validation & Recommendations**:
 *    - Live character progress meters comparing current copy against both recommended UX thresholds
 *      (e.g. `≤ 40` chars for Title, `≤ 140` chars for Description before the `"More…"` fold, `≤ 25` chars
 *      for Suggested Actions) and hard Google RBM API limits.
 *    - Visual Safe-Zone Media Crop minimap & file-size validator (`SHORT 112dp`, `MEDIUM 168dp`, `TALL 264dp`,
 *      plus Carousel `SMALL 120dp` and `MEDIUM 200dp` widths).
 *    - Automatic RBM Agent brand detection (`setAgentFromExternal`) with canvas dominant-color extraction
 *      on logo upload and graceful fallback to a generic business profile when agent metadata is absent.
 */
class RcsTemplateChooser {
  /**
   * Initializes the RCS Template & Content Chooser inside `container`.
   *
   * @param {HTMLElement|string} container - Target DOM element or CSS selector.
   * @param {Object} [options={}] - Optional configuration overrides.
   * @param {string} [options.initialPreset='hospital_preventive_carousel'] - Initial campaign preset key.
   * @param {Object} [options.agent] - Custom initial RBM Agent branding object.
   * @param {Object} [options.payload] - Custom initial RBM message payload object.
   * @param {Function} [options.onChange] - Callback invoked whenever template/content/agent state changes.
   * @param {Function} [options.onTriggerFlow] - Callback invoked when conversation flow actions are triggered.
   */
  constructor(container, options = {}) {
    this.root = typeof container === 'string' ? document.querySelector(container) : container;
    if (!this.root) {
      throw new Error('RcsTemplateChooser: valid target container element is required.');
    }

    const defaultPreset = REAL_CAMPAIGN_PRESETS[options.initialPreset || 'hospital_preventive_carousel'];
    this.state = {
      activePresetId: defaultPreset.id,
      activeCardIndex: 0,
      showCropGuides: true,
      agentDetected: true,
      /**
       * Tracks which accordion modules in the vertical stack are currently collapsed.
       * By default, core editing modules (`templates` through `fallback`) are expanded
       * while the raw REST JSON payload (`json`) starts collapsed to keep the scroll tidy.
       */
      collapsedModules: {
        templates: false,
        cards: false,
        media: false,
        copy: false,
        actions: false,
        agent: false,
        fallback: false,
        json: true
      },
      agent: structuredClone(options.agent || defaultPreset.agent),
      payload: structuredClone(options.payload || defaultPreset.payload)
    };

    this.onChange = typeof options.onChange === 'function' ? options.onChange : null;
    this.onTriggerFlow = typeof options.onTriggerFlow === 'function' ? options.onTriggerFlow : null;

    this.render();
    this.attachEvents();
    this.emitChange('init');
  }

  /**
   * Public API: Returns a deep clone of the current complete module state (`payload`, `agent`, `collapsedModules`, etc.).
   * @returns {Object}
   */
  getState() {
    return structuredClone(this.state);
  }

  /**
   * Public API: Loads one of the built-in campaign presets (`hospital_preventive_carousel`, `tipos_lottery`,
   * `telekom_carousel`, `doxxbet_multi`, `whitelabel_booking`) and notifies listeners.
   *
   * @param {string} presetId - Key in `REAL_CAMPAIGN_PRESETS`.
   */
  loadPreset(presetId) {
    const preset = REAL_CAMPAIGN_PRESETS[presetId];
    if (!preset) return;
    this.state.activePresetId = preset.id;
    this.state.activeCardIndex = 0;
    this.state.agent = structuredClone(preset.agent);
    this.state.payload = structuredClone(preset.payload);
    this.render();
    this.attachEvents();
    this.emitChange('preset-load');
  }

  /**
   * Public API: Toggles or explicitly sets the collapsed state of a specific accordion module card.
   * Performs an in-place DOM class update when possible so scroll position and input focus are never disrupted.
   *
   * @param {string} moduleId - Module key (`'templates'|'cards'|'media'|'copy'|'actions'|'agent'|'fallback'|'json'`).
   * @param {boolean|null} [forceCollapse=null] - Optional explicit boolean (`true` = collapse, `false` = expand).
   */
  toggleModule(moduleId, forceCollapse = null) {
    if (!(moduleId in this.state.collapsedModules)) return;
    const nextCollapsed = forceCollapse !== null
      ? Boolean(forceCollapse)
      : !this.state.collapsedModules[moduleId];
    this.state.collapsedModules[moduleId] = nextCollapsed;

    // Update DOM in place for instant, smooth animation without losing focus or scroll
    const sectionEl = this.root.querySelector(`[data-module-card="${moduleId}"]`);
    if (sectionEl) {
      sectionEl.classList.toggle('is-collapsed', nextCollapsed);
      const headBtn = sectionEl.querySelector('.rcs-accordion-head');
      if (headBtn) {
        headBtn.setAttribute('aria-expanded', String(!nextCollapsed));
      }
      return;
    }

    this.render();
    this.attachEvents();
  }

  /**
   * Public API: Expands or collapses all 8 accordion modules simultaneously.
   * @param {boolean} collapsed - `true` to collapse all modules, `false` to expand all.
   */
  setAllModulesCollapsed(collapsed) {
    Object.keys(this.state.collapsedModules).forEach((k) => {
      this.state.collapsedModules[k] = Boolean(collapsed);
    });
    this.render();
    this.attachEvents();
  }

  /**
   * Public API: Simulates auto-detecting RBM Agent branding (Display Name, Brand Color, Logo, Verification)
   * from an external host platform, or falls back to a customizable generic white-label profile when `null`.
   *
   * @param {Object|null} [agentData=null] - External RBM agent profile object, or `null` to trigger fallback.
   */
  setAgentFromExternal(agentData = null) {
    if (agentData && agentData.name) {
      this.state.agentDetected = true;
      this.state.agent = {
        ...this.state.agent,
        ...agentData
      };
    } else {
      this.state.agentDetected = false;
      this.state.agent = {
        name: 'Generic Business Agent',
        verified: false,
        tagline: 'Automated RCS Business Messaging Service (Fallback Agent Profile)',
        color: '#475569',
        avatarShape: 'rounded',
        logoUrl: `data:image/svg+xml;utf8,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160"><rect width="160" height="160" rx="36" fill="#475569"/><text x="80" y="98" fill="#ffffff" font-family="system-ui, sans-serif" font-size="56" font-weight="800" text-anchor="middle">RCS</text></svg>')}`,
        showAgentHeader: true,
        showRbmChatNotice: true,
        timestampLabel: 'Today • 12:00',
        messageTime: '12:00',
        showSpamBanner: false,
        showScrollDownBtn: false
      };
    }
    this.render();
    this.attachEvents();
    this.emitChange('agent-detect');
  }

  emitChange(reason = 'update') {
    const detail = {
      reason,
      state: this.getState(),
      agent: structuredClone(this.state.agent),
      payload: structuredClone(this.state.payload),
      showCropGuides: this.state.showCropGuides
    };
    this.root.dispatchEvent(new CustomEvent('rcs:change', { detail, bubbles: true, composed: true }));
    if (this.onChange) {
      this.onChange(detail);
    }
  }

  getCurrentCard() {
    const cards = this.state.payload.cards || [];
    if (!cards.length) {
      cards.push({
        id: `card-${Date.now()}`,
        mediaUrl: '',
        mediaType: 'image',
        mediaSizeKb: 250,
        mediaDimensions: { width: 1440, height: 720 },
        title: 'Card Title',
        description: 'Card description text.',
        suggestions: []
      });
    }
    if (this.state.activeCardIndex >= cards.length) {
      this.state.activeCardIndex = 0;
    }
    return cards[this.state.activeCardIndex];
  }

  selectTemplate(templateId) {
    const tpl = TEMPLATES.find((t) => t.id === templateId);
    if (!tpl) return;

    this.state.payload.templateId = tpl.id;
    this.state.payload.channel = tpl.channel;
    this.state.payload.mediaHeight = tpl.defaultMediaHeight;

    if (tpl.id === 'carousel' || tpl.id === 'multi_card_feed') {
      if (this.state.payload.cards.length < 2) {
        const first = structuredClone(this.getCurrentCard());
        first.id = `card-${Date.now()}-2`;
        first.title = 'Second Offer Card ✨';
        this.state.payload.cards.push(first);
      }
    }

    this.render();
    this.attachEvents();
    this.emitChange('template-select');
  }

  renderCharMeter(text = '', limitSpec) {
    const len = Array.from(text || '').length;
    const rec = limitSpec.recommended;
    const max = limitSpec.max;
    const pct = Math.min(100, Math.round((len / max) * 100));
    let statusClass = 'ok';
    let statusText = `Optimal (≤ ${rec} chars)`;
    if (len > max) {
      statusClass = 'danger';
      statusText = `Exceeds max (${max})!`;
    } else if (len > rec) {
      statusClass = 'warn';
      statusText = `Long (> ${rec} chars may wrap/fold)`;
    }

    return `
      <div class="rcs-meter-wrap">
        <div class="rcs-meter-bar">
          <div class="rcs-meter-fill is-${statusClass}" style="width:${pct}%"></div>
        </div>
        <div class="rcs-meter-meta">
          <span class="rcs-meter-badge is-${statusClass}">${statusText}</span>
          <span class="rcs-meter-count"><strong>${len}</strong> / ${rec} rec (${max} max)</span>
        </div>
      </div>
    `;
  }

  /**
   * Helper to wrap each section in a collapsible accordion module card
   */
  renderModuleCard({ id, icon, stepNum, title, summaryBadge, docUrl, docTooltip, headerRightHtml = '', bodyHtml }) {
    const isCollapsed = Boolean(this.state.collapsedModules[id]);
    return `
      <section class="rcs-panel-section rcs-accordion-card ${isCollapsed ? 'is-collapsed' : ''}" data-module-card="${id}" id="rcs-mod-${id}">
        <div class="rcs-accordion-head" data-toggle-module="${id}" role="button" tabindex="0" aria-expanded="${!isCollapsed}">
          <div class="rcs-accordion-head-left">
            <span class="rcs-mod-icon-box" aria-hidden="true">
              ${getIcon(icon)}
            </span>
            <div class="rcs-mod-title-stack">
              <div class="rcs-mod-title-row">
                ${stepNum ? `<span class="rcs-mod-step">${stepNum}</span>` : ''}
                <span class="rcs-section-title">${title}</span>
                ${docUrl ? renderDocLink(docUrl, docTooltip || title) : ''}
              </div>
              ${summaryBadge ? `<span class="rcs-mod-summary-pill">${summaryBadge}</span>` : ''}
            </div>
          </div>
          <div class="rcs-accordion-head-right">
            ${headerRightHtml ? `<div class="rcs-accordion-actions" onclick="event.stopPropagation()">${headerRightHtml}</div>` : ''}
            <span class="rcs-accordion-chevron" title="Click to expand or collapse section">
              ${getIcon('chevron-down')}
            </span>
          </div>
        </div>
        <div class="rcs-accordion-body">
          ${bodyHtml}
        </div>
      </section>
    `;
  }

  render() {
    const prevBody = this.root.querySelector('.rcs-chooser-body');
    const prevScrollTop = prevBody ? prevBody.scrollTop : 0;

    const { payload, agent, activeCardIndex, showCropGuides, activePresetId, agentDetected, collapsedModules } = this.state;
    const currentTemplate = TEMPLATES.find((t) => t.id === payload.templateId) || TEMPLATES[0];
    const card = this.getCurrentCard();
    const isMulti = payload.templateId === 'carousel' || payload.templateId === 'multi_card_feed';
    const isCarousel = payload.templateId === 'carousel';
    const isHorizontal = payload.templateId === 'standalone_horizontal';
    const isTextOnly = payload.templateId === 'text_with_chips';
    const isSms = payload.templateId === 'sms_regular';

    const cropInfo = evaluateMediaCrop(
      card.mediaDimensions,
      payload.mediaHeight,
      isCarousel,
      payload.cardWidth
    );

    const smsAnalysis = analyzeSmsSegments(payload.smsFallbackText || card.description || '');
    const allCollapsed = Object.values(collapsedModules).every(Boolean);

    this.root.innerHTML = `
      <div class="rcs-chooser-shell">
        <!-- Top Header: Module Title + Campaign Preset Selector -->
        <div class="rcs-chooser-topbar">
          <div class="rcs-module-title">
            <span class="rcs-module-badge">MODULE 1</span>
            <h2>Template & Content Chooser</h2>
            ${renderDocLink(RCS_DOCS.overview.url, 'Official Google RBM Developer Documentation')}
          </div>

          <div class="rcs-preset-bar" title="Load authentic campaign presets from real screenshots">
            <label for="rcs-preset-select" class="rcs-sr-only">Preset</label>
            <select id="rcs-preset-select" class="rcs-select-compact rcs-preset-select-pill">
              ${Object.values(REAL_CAMPAIGN_PRESETS).map((p) => `
                <option value="${p.id}" ${p.id === activePresetId ? 'selected' : ''}>★ Preset: ${p.label}</option>
              `).join('')}
            </select>
          </div>
        </div>

        <!-- Sticky Quick-Jump Navigation & Expand/Collapse All Bar -->
        <div class="rcs-Subnav-strip" role="navigation" aria-label="Quick section jump and accordion controls">
          <div class="rcs-jump-pills">
            <button type="button" class="rcs-jump-pill" data-jump-mod="templates" title="Jump to Template Format">
              ${getIcon(currentTemplate.icon)} <span>Template</span>
            </button>
            ${isMulti ? `
              <button type="button" class="rcs-jump-pill" data-jump-mod="cards" title="Jump to Carousel Cards (${payload.cards.length})">
                ${getIcon('layers')} <span>Cards (${payload.cards.length})</span>
              </button>
            ` : ''}
            ${(!isTextOnly && !isSms) ? `
              <button type="button" class="rcs-jump-pill" data-jump-mod="media" title="Jump to Media & Safe-Zone Crop">
                ${getIcon('crop')} <span>Media & Crop</span>
              </button>
            ` : ''}
            <button type="button" class="rcs-jump-pill" data-jump-mod="copy" title="Jump to Text & Copy">
              ${getIcon('text')} <span>Text & Copy</span>
            </button>
            ${!isSms ? `
              <button type="button" class="rcs-jump-pill" data-jump-mod="actions" title="Jump to Suggested Actions">
                ${getIcon('reply')} <span>Actions (${(card.suggestions || []).length}/4)</span>
              </button>
            ` : ''}
            <button type="button" class="rcs-jump-pill" data-jump-mod="agent" title="Jump to Agent Branding">
              ${getIcon('verified')} <span>Agent Brand</span>
              <span class="rcs-dot ${agentDetected ? 'is-detected' : 'is-fallback'}"></span>
            </button>
            <button type="button" class="rcs-jump-pill" data-jump-mod="fallback" title="Jump to SMS Fallback & Flow">
              ${getIcon('sms')} <span>SMS & Flow</span>
            </button>
            <button type="button" class="rcs-jump-pill" data-jump-mod="json" title="Jump to RBM JSON Payload">
              ${getIcon('code')} <span>JSON</span>
            </button>
          </div>

          <div class="rcs-fold-controls">
            <button type="button" class="rcs-fold-btn" id="rcs-toggle-all-modules" title="${allCollapsed ? 'Expand all sections' : 'Collapse all sections'}">
              ${getIcon(allCollapsed ? 'expand-all' : 'collapse-all')}
              <span>${allCollapsed ? 'Expand All' : 'Collapse All'}</span>
            </button>
          </div>
        </div>

        <!-- Vertically Scrollable Accordion Stack -->
        <div class="rcs-chooser-body">
          ${this.renderTemplatesModule(currentTemplate, payload)}

          ${isMulti ? this.renderCardsDeckModule(payload, card, activeCardIndex) : ''}

          ${(!isTextOnly && !isSms) ? this.renderMediaCropModule({
            payload,
            card,
            isCarousel,
            isHorizontal,
            cropInfo,
            showCropGuides
          }) : ''}

          ${this.renderTextCopyModule({ card, isTextOnly, isSms })}

          ${!isSms ? this.renderActionsModule({ card }) : ''}

          ${this.renderAgentModule({ agent, agentDetected })}

          ${this.renderFallbackFlowModule({ payload, smsAnalysis })}

          ${this.renderJsonModule({ payload, agent })}
        </div>
      </div>
    `;

    const newBody = this.root.querySelector('.rcs-chooser-body');
    if (newBody && prevScrollTop > 0) {
      newBody.scrollTop = prevScrollTop;
    }
  }

  renderTemplatesModule(currentTemplate, payload) {
    const bodyHtml = `
      <div class="rcs-template-grid" role="listbox" aria-label="RCS Rich Card Templates">
        ${TEMPLATES.map((tpl) => {
          const active = tpl.id === payload.templateId;
          return `
            <button type="button"
              class="rcs-tpl-card ${active ? 'is-active' : ''}"
              data-tpl-id="${tpl.id}"
              role="option"
              aria-selected="${active}"
              title="${this.escapeHtml(tpl.description)}">
              <div class="rcs-tpl-card-head">
                <span class="rcs-tpl-card-ico">${getIcon(tpl.icon, 'rcs-tpl-ico')}</span>
                <div class="rcs-tpl-card-meta">
                  <span class="rcs-tpl-name">${tpl.shortName}</span>
                  <span class="rcs-tpl-channel-tag ${tpl.channel === 'sms' ? 'is-sms' : 'is-rcs'}">${tpl.channel.toUpperCase()}</span>
                </div>
                ${renderDocLink(tpl.docUrl, `${tpl.name} — Official Spec`)}
              </div>
              <p class="rcs-tpl-card-desc">${this.escapeHtml(tpl.description)}</p>
            </button>
          `;
        }).join('')}
      </div>
    `;

    return this.renderModuleCard({
      id: 'templates',
      icon: currentTemplate.icon,
      stepNum: '01',
      title: 'RCS Template & Format',
      summaryBadge: `${currentTemplate.name} (${currentTemplate.channel.toUpperCase()})`,
      docUrl: currentTemplate.docUrl,
      docTooltip: `${currentTemplate.name} Official Specification`,
      bodyHtml
    });
  }

  renderCardsDeckModule(payload, card, activeCardIndex) {
    const headerRightHtml = `
      <div class="rcs-card-actions">
        <button type="button" class="rcs-icon-btn" id="rcs-add-card-btn" title="Add Card (max 10 in Carousel)" ${payload.cards.length >= 10 ? 'disabled' : ''}>
          ${getIcon('plus')} <span>Add Card</span>
        </button>
        ${payload.cards.length > 2 ? `
          <button type="button" class="rcs-icon-btn is-danger" id="rcs-del-card-btn" title="Remove active card">
            ${getIcon('trash')}
          </button>
        ` : ''}
      </div>
    `;

    const bodyHtml = `
      <div class="rcs-card-deck-grid">
        ${payload.cards.map((c, idx) => {
          const active = idx === activeCardIndex;
          return `
            <button type="button" class="rcs-deck-card-pill ${active ? 'is-active' : ''}" data-card-idx="${idx}">
              <span class="rcs-deck-thumb" style="background-image: url('${c.mediaUrl || ''}')">
                <span class="rcs-deck-index">#${idx + 1}</span>
              </span>
              <span class="rcs-deck-info">
                <strong class="rcs-deck-title">${this.escapeHtml(c.title || `Card #${idx + 1}`)}</strong>
                <small class="rcs-deck-sub">${(c.suggestions || []).length} action${(c.suggestions || []).length === 1 ? '' : 's'}</small>
              </span>
            </button>
          `;
        }).join('')}
      </div>
    `;

    return this.renderModuleCard({
      id: 'cards',
      icon: 'layers',
      stepNum: '02',
      title: `Carousel / Multi-Card Deck (${payload.cards.length}/10)`,
      summaryBadge: `Editing Card #${activeCardIndex + 1}: ${(card.title || 'Card').slice(0, 26)}`,
      docUrl: RCS_DOCS.carousels.url,
      docTooltip: 'Carousel Rich Cards (2 to 10 cards)',
      headerRightHtml,
      bodyHtml
    });
  }

  renderMediaCropModule({ payload, card, isCarousel, isHorizontal, cropInfo, showCropGuides }) {
    const sizeKb = card.mediaSizeKb || 320;
    const maxKb = card.mediaType === 'video'
      ? cropInfo.spec.maxVideoKb
      : card.mediaType === 'gif'
        ? cropInfo.spec.maxGifKb
        : cropInfo.spec.maxImageKb;
    const sizeOk = sizeKb <= maxKb;

    const headerRightHtml = `
      <label class="rcs-toggle-chip" title="Highlight cropped vs visible zones on the phone preview">
        <input type="checkbox" id="rcs-crop-guide-toggle" ${showCropGuides ? 'checked' : ''}/>
        <span>Crop Overlay on Phone</span>
      </label>
    `;

    const summaryParts = [
      !isHorizontal ? `${payload.mediaHeight} (${MEDIA_SPECS[payload.mediaHeight]?.dpHeight || 264}dp)` : `Thumb ${payload.thumbnailAlignment || 'LEFT'}`,
      isCarousel ? `Width: ${payload.cardWidth}` : null,
      `${cropInfo.croppedPercent}% crop`
    ].filter(Boolean).join(' • ');

    const bodyHtml = `
      <div class="rcs-geometry-grid">
        ${!isHorizontal ? `
          <div class="rcs-field-group">
            <label class="rcs-field-label">
              Media Height (dp) ${renderDocLink(RCS_DOCS.richCards.url, 'CardMedia.Height: SHORT (112dp), MEDIUM (168dp), TALL (264dp)')}
            </label>
            <div class="rcs-segmented">
              ${['SHORT', 'MEDIUM', 'TALL'].map((hKey) => `
                <button type="button" class="rcs-seg-btn ${payload.mediaHeight === hKey ? 'is-active' : ''}" data-media-height="${hKey}">
                  <strong>${hKey}</strong>
                  <small>${MEDIA_SPECS[hKey].dpHeight}dp</small>
                </button>
              `).join('')}
            </div>
          </div>
        ` : `
          <div class="rcs-field-group">
            <label class="rcs-field-label">
              Thumbnail Side ${renderDocLink(RCS_DOCS.richCards.url, 'Horizontal Rich Card ThumbnailAlignment')}
            </label>
            <div class="rcs-segmented">
              ${['LEFT', 'RIGHT'].map((side) => `
                <button type="button" class="rcs-seg-btn ${payload.thumbnailAlignment === side ? 'is-active' : ''}" data-thumb-align="${side}">
                  <strong>${side}</strong>
                  <small>128dp side</small>
                </button>
              `).join('')}
            </div>
          </div>
        `}

        ${isCarousel ? `
          <div class="rcs-field-group">
            <label class="rcs-field-label">
              Carousel Card Width ${renderDocLink(RCS_DOCS.carousels.url, 'CarouselCard.CardWidth: SMALL (120dp) or MEDIUM (200dp)')}
            </label>
            <div class="rcs-segmented">
              ${['SMALL', 'MEDIUM'].map((wKey) => `
                <button type="button" class="rcs-seg-btn ${payload.cardWidth === wKey ? 'is-active' : ''}" data-card-width="${wKey}">
                  <strong>${wKey}</strong>
                  <small>${CAROUSEL_WIDTH_SPECS[wKey].rawSpecDp}dp</small>
                </button>
              `).join('')}
            </div>
          </div>
        ` : ''}
      </div>

      <!-- Interactive Crop & File Size Diagnostic Box -->
      <div class="rcs-crop-diagnostic">
        <div class="rcs-crop-minimap" title="Visual representation of how RCS center-crops your media">
          <div class="rcs-crop-stage" style="aspect-ratio: ${cropInfo.srcW} / ${cropInfo.srcH}; background-image: url('${card.mediaUrl}')">
            <div class="rcs-crop-mask is-${cropInfo.cropAxis}" style="
              ${cropInfo.cropAxis === 'horizontal'
                ? `width: ${Math.round(cropInfo.visibleFraction * 100)}%; height: 100%;`
                : cropInfo.cropAxis === 'vertical'
                  ? `width: 100%; height: ${Math.round(cropInfo.visibleFraction * 100)}%;`
                  : 'width: 100%; height: 100%;'}
            ">
              <span class="rcs-crop-safe-tag">SAFE VISIBLE ZONE</span>
            </div>
          </div>
        </div>

        <div class="rcs-crop-stats">
          <div class="rcs-spec-pill">
            <span class="rcs-spec-k">Recommended Size:</span>
            <strong class="rcs-spec-v">${cropInfo.recText}</strong>
          </div>
          <div class="rcs-spec-pill">
            <span class="rcs-spec-k">Current Asset:</span>
            <strong class="rcs-spec-v ${sizeOk ? 'is-ok' : 'is-warn'}">
              ${cropInfo.srcW}×${cropInfo.srcH} px • ${sizeKb} KB (${(card.mediaType || 'image').toUpperCase()})
            </strong>
          </div>
          <div class="rcs-spec-pill">
            <span class="rcs-spec-k">Center-Crop Impact:</span>
            <strong class="rcs-spec-v ${cropInfo.croppedPercent > 20 ? 'is-warn' : 'is-ok'}">
              ${cropInfo.croppedPercent === 0
                ? 'Exact aspect match (0% cropped)'
                : `${cropInfo.croppedPercent}% cropped (${cropInfo.cropAxis === 'horizontal' ? 'left/right edges' : 'top/bottom edges'})`}
            </strong>
          </div>

          <div class="rcs-upload-row">
            <label class="rcs-upload-btn">
              ${getIcon('upload')} <span>Upload Image / GIF / MP4</span>
              <input type="file" id="rcs-media-file-input" accept="image/*,video/mp4,video/webm" hidden />
            </label>
            <button type="button" class="rcs-btn-ghost" id="rcs-sample-gif-btn" title="Load animated GIF/Video simulation">
              ${getIcon('play')} <span>Demo Animated Media</span>
            </button>
          </div>
        </div>
      </div>
    `;

    return this.renderModuleCard({
      id: 'media',
      icon: 'crop',
      stepNum: '03',
      title: 'Media Geometry & Safe-Zone Crop',
      summaryBadge: summaryParts,
      docUrl: RCS_DOCS.media.url,
      docTooltip: 'Official Media Sizes, Heights & Center-Crop Spec',
      headerRightHtml,
      bodyHtml
    });
  }

  renderTextCopyModule({ card, isTextOnly, isSms }) {
    const titleLen = Array.from(card.title || '').length;
    const descLen = Array.from(card.description || '').length;
    const summaryBadge = (!isTextOnly && !isSms)
      ? `Title: ${titleLen}/${TEXT_LIMITS.title.recommended} • Desc: ${descLen}/${TEXT_LIMITS.description.recommended} chars`
      : `Message: ${descLen} chars`;

    const bodyHtml = `
      ${!isTextOnly && !isSms ? `
        <div class="rcs-field-group">
          <div class="rcs-label-row">
            <label for="rcs-card-title" class="rcs-field-label">
              Card Title ${renderDocLink(TEXT_LIMITS.title.docUrl, TEXT_LIMITS.title.hint)}
            </label>
            <span class="rcs-micro-hint">Recommended ≤ 40 chars (max 200)</span>
          </div>
          <input type="text" id="rcs-card-title" class="rcs-input" value="${this.escapeHtml(card.title)}" maxlength="220" placeholder="Enter headline..." />
          ${this.renderCharMeter(card.title, TEXT_LIMITS.title)}
        </div>
      ` : ''}

      <div class="rcs-field-group">
        <div class="rcs-label-row">
          <label for="rcs-card-desc" class="rcs-field-label">
            ${isSms ? 'SMS Message Body' : isTextOnly ? 'RCS Message Text' : 'Card Description'}
            ${renderDocLink(isSms ? TEXT_LIMITS.smsFallback.docUrl : TEXT_LIMITS.description.docUrl, isSms ? TEXT_LIMITS.smsFallback.hint : TEXT_LIMITS.description.hint)}
          </label>
          <span class="rcs-micro-hint">${isSms ? '160 GSM-7 / 70 Unicode' : 'Recommended ≤ 140 chars before fold'}</span>
        </div>
        <textarea id="rcs-card-desc" class="rcs-textarea" rows="4" placeholder="Enter message description...">${this.escapeHtml(card.description)}</textarea>
        ${this.renderCharMeter(card.description, isSms ? { recommended: 160, max: 320 } : TEXT_LIMITS.description)}
      </div>
    `;

    return this.renderModuleCard({
      id: 'copy',
      icon: 'text',
      stepNum: '04',
      title: 'Text & Copy Recommendations',
      summaryBadge,
      docUrl: RCS_DOCS.richCards.url,
      docTooltip: 'Title (max 200 chars) & Description (max 2,000 chars)',
      bodyHtml
    });
  }

  renderActionsModule({ card }) {
    const suggestions = card.suggestions || [];
    const headerRightHtml = `
      <button type="button" class="rcs-icon-btn" id="rcs-add-suggestion-btn" ${suggestions.length >= 4 ? 'disabled' : ''}>
        ${getIcon('plus')} <span>Add Action</span>
      </button>
    `;

    const bodyHtml = `
      <div class="rcs-suggestions-list">
        ${suggestions.length === 0 ? `
          <div class="rcs-empty-hint">No suggested actions or replies on this card yet. Click <strong>+ Add Action</strong> to add up to 4 buttons.</div>
        ` : suggestions.map((sug, sIdx) => {
          const sugLen = Array.from(sug.text || '').length;
          const isOver = sugLen > TEXT_LIMITS.suggestionText.max;
          const actionSpec = ACTION_TYPES[sug.type] || ACTION_TYPES.url;
          return `
            <div class="rcs-sug-card" data-sug-idx="${sIdx}">
              <div class="rcs-sug-card-top">
                <span class="rcs-sug-badge">#${sIdx + 1}</span>
                <select class="rcs-sug-type" data-sug-idx="${sIdx}" title="Action Type">
                  ${Object.values(ACTION_TYPES).map((a) => `
                    <option value="${a.id}" ${sug.type === a.id ? 'selected' : ''}>${a.label}</option>
                  `).join('')}
                </select>
                <div class="rcs-sug-input-wrap">
                  <input type="text" class="rcs-input rcs-sug-text" data-sug-idx="${sIdx}" value="${this.escapeHtml(sug.text)}" placeholder="Button label (≤25 chars)" />
                  <span class="rcs-sug-counter ${isOver ? 'is-danger' : sugLen > 20 ? 'is-warn' : ''}" title="Max 25 chars">${sugLen}/25</span>
                </div>
                ${renderDocLink(actionSpec.docUrl || RCS_DOCS.suggestedActions.url, `${actionSpec.label} API Spec`)}
                <button type="button" class="rcs-sug-del" data-sug-idx="${sIdx}" title="Remove button">${getIcon('trash')}</button>
              </div>
              <div class="rcs-sug-card-bottom">
                <span class="rcs-sug-target-label">${sug.type === 'reply' ? 'Postback Payload:' : sug.type === 'dial' ? 'Phone Number:' : 'Target URL / Value:'}</span>
                <input type="text" class="rcs-input rcs-sug-val" data-sug-idx="${sIdx}" value="${this.escapeHtml(sug.value || '')}" placeholder="https://... or postback_id" />
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;

    return this.renderModuleCard({
      id: 'actions',
      icon: 'reply',
      stepNum: '05',
      title: `Suggested Actions & Replies (${suggestions.length}/4)`,
      summaryBadge: suggestions.length
        ? suggestions.map((s) => s.text).join(' • ')
        : 'No buttons configured',
      docUrl: RCS_DOCS.suggestedActions.url,
      docTooltip: 'Up to 4 Suggested Actions / Replies per card (max 25 chars each)',
      headerRightHtml,
      bodyHtml
    });
  }
