<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>White-Label RCS for Business — Agnostic Template Chooser & Mobile Preview SDK</title>
  <meta name="description" content="Framework-agnostic HTML/JS modules for choosing RCS Rich Card templates, analyzing media center-crop & character limits, and previewing across Android Google Messages, Samsung One UI, and iOS 18 RCS." />
  <style>/**
 * @fileoverview Stylesheet for the Agnostic RCS Rich Card Template Chooser (`RcsTemplateChooser`)
 * and Mobile Phone Simulator (`RcsPhonePreview`).
 * Engineered to fit comfortably within a 1280×720 (720p) viewport while adapting fluidly to larger screens.
 */

:root {
  --studio-bg: #0f141c;
  --studio-panel: #161d27;
  --studio-panel-elevated: #1d2633;
  --studio-border: #283344;
  --studio-border-subtle: #1f2937;
  --studio-text: #f1f5f9;
  --studio-text-muted: #94a3b8;
  --studio-text-dim: #64748b;
  --studio-accent: #0284c7;
  --studio-accent-hover: #0369a1;
  --studio-accent-soft: rgba(2, 132, 199, 0.16);
  --studio-ok: #10b981;
  --studio-warn: #f59e0b;
  --studio-danger: #ef4444;
  --studio-radius: 8px;
  --studio-font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--studio-bg);
  color: var(--studio-text);
  font-family: var(--studio-font);
  font-size: 12.5px;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
}

/* ==========================================================================
   Compact 720p Studio Shell Layout
   ========================================================================== */
.rcs-workbench {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-height: 100vh;
  overflow: hidden;
}

.rcs-workbench-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 40px;
  padding: 0 12px;
  background: #0b0f16;
  border-bottom: 1px solid var(--studio-border);
  flex-shrink: 0;
}

.rcs-brand-cluster {
  display: flex;
  align-items: center;
  gap: 8px;
}

.rcs-brand-logo {
  width: 22px;
  height: 22px;
  border-radius: 5px;
  background: var(--studio-accent);
  color: #fff;
  font-weight: 800;
  font-size: 11px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  letter-spacing: -0.5px;
}

.rcs-workbench-header h1 {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--studio-text);
}

.rcs-header-tag {
  font-size: 10.5px;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--studio-panel-elevated);
  color: var(--studio-text-muted);
  border: 1px solid var(--studio-border);
}

.rcs-header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.rcs-mode-switcher {
  display: inline-flex;
  background: var(--studio-panel);
  border: 1px solid var(--studio-border);
  border-radius: 6px;
  padding: 2px;
  gap: 2px;
}

.rcs-mode-btn {
  background: transparent;
  border: none;
  color: var(--studio-text-muted);
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 4px;
  cursor: pointer;
}

.rcs-mode-btn.is-active {
  background: var(--studio-accent);
  color: #fff;
}

/* Main 2-Module Grid (Fits 1280×720 cleanly) */
.rcs-workbench-grid {
  display: grid;
  grid-template-columns: minmax(420px, 47%) 1fr;
  gap: 8px;
  padding: 8px;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

.rcs-workbench-grid.is-mode-chooser-only {
  grid-template-columns: 1fr;
  max-width: 780px;
  margin: 0 auto;
  width: 100%;
}

.rcs-workbench-grid.is-mode-preview-only {
  grid-template-columns: 1fr;
}

.rcs-module-slot {
  display: flex;
  flex-direction: column;
  min-height: 0;
  height: 100%;
  background: var(--studio-panel);
  border: 1px solid var(--studio-border);
  border-radius: var(--studio-radius);
  overflow: hidden;
}

/* ==========================================================================
   Tiny, Color-Neutral Documentation Link Icon
   ========================================================================== */
.rcs-doc-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  color: #78879b;
  background: rgba(148, 163, 184, 0.1);
  border: 1px solid rgba(148, 163, 184, 0.22);
  text-decoration: none;
  vertical-align: middle;
  transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  flex-shrink: 0;
}

.rcs-doc-link:hover {
  color: #cbd5e1;
  background: rgba(148, 163, 184, 0.24);
  border-color: rgba(203, 213, 225, 0.45);
}

.rcs-ico {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 15px;
  height: 15px;
  flex-shrink: 0;
}

.rcs-ico svg {
  width: 100%;
  height: 100%;
}

/* ==========================================================================
   Module 1: RcsTemplateChooser Styles
   ========================================================================== */
.rcs-chooser-shell,
.rcs-preview-shell {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}

.rcs-chooser-topbar,
.rcs-preview-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 6px 10px;
  background: #121821;
  border-bottom: 1px solid var(--studio-border);
  flex-shrink: 0;
  flex-wrap: wrap;
}

.rcs-module-title {
  display: flex;
  align-items: center;
  gap: 6px;
}

.rcs-module-badge {
  font-size: 9.5px;
  font-weight: 800;
  padding: 2px 5px;
  border-radius: 3px;
  background: rgba(2, 132, 199, 0.2);
  color: #38bdf8;
  letter-spacing: 0.04em;
}

.rcs-module-badge.is-preview {
  background: rgba(16, 185, 129, 0.18);
  color: #34d399;
}

.rcs-module-title h2 {
  margin: 0;
  font-size: 12px;
  font-weight: 700;
  color: var(--studio-text);
}

/* Pictogram Template Strip */
.rcs-template-strip {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px;
  padding: 6px 8px;
  background: #131a24;
  border-bottom: 1px solid var(--studio-border);
  flex-shrink: 0;
}

.rcs-tpl-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 5px 4px;
  background: var(--studio-panel-elevated);
  border: 1px solid var(--studio-border);
  border-radius: 6px;
  color: var(--studio-text-muted);
  cursor: pointer;
  transition: all 0.14s ease;
}

.rcs-tpl-btn:hover {
  border-color: #475569;
  color: var(--studio-text);
}

.rcs-tpl-btn.is-active {
  background: var(--studio-accent-soft);
  border-color: var(--studio-accent);
  color: #fff;
}

.rcs-tpl-btn-top {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  width: 100%;
}

.rcs-tpl-ico {
  width: 18px;
  height: 18px;
  display: inline-flex;
}

.rcs-tpl-name {
  font-size: 10.5px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

/* Secondary Mode Tabs */
.rcs-subtabs {
  display: flex;
  gap: 2px;
  padding: 4px 8px 0;
  background: #121821;
  border-bottom: 1px solid var(--studio-border);
  flex-shrink: 0;
}

.rcs-subtab {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--studio-text-muted);
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
}

.rcs-subtab:hover {
  color: var(--studio-text);
}

.rcs-subtab.is-active {
  color: #38bdf8;
  border-bottom-color: #38bdf8;
}

.rcs-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

.rcs-dot.is-detected {
  background: var(--studio-ok);
}

.rcs-dot.is-fallback {
  background: var(--studio-warn);
}

/* Scrollable Chooser Body */
.rcs-chooser-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.rcs-panel-section {
  background: #121821;
  border: 1px solid var(--studio-border);
  border-radius: 6px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.rcs-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.rcs-section-title {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 700;
  color: #e2e8f0;
}

/* Card Switcher Bar for Carousel / Multi-Card */
.rcs-card-switcher {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  background: #121821;
  border: 1px solid var(--studio-border);
  border-radius: 6px;
  padding: 5px 8px;
}

.rcs-card-pills {
  display: flex;
  gap: 4px;
  overflow-x: auto;
}

.rcs-card-pill {
  background: var(--studio-panel-elevated);
  border: 1px solid var(--studio-border);
  color: var(--studio-text-muted);
  border-radius: 4px;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

.rcs-card-pill.is-active {
  background: var(--studio-accent);
  border-color: var(--studio-accent);
  color: #fff;
}

.rcs-card-actions {
  display: flex;
  gap: 4px;
}

/* Geometry & Crop Controls */
.rcs-geometry-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 8px;
}

.rcs-segmented {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));
  gap: 3px;
  background: var(--studio-panel);
  padding: 2px;
  border-radius: 5px;
  border: 1px solid var(--studio-border);
}

.rcs-seg-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 3px 4px;
  background: transparent;
  border: none;
  border-radius: 4px;
  color: var(--studio-text-muted);
  cursor: pointer;
  font-size: 10.5px;
}

.rcs-seg-btn small {
  font-size: 9.5px;
  opacity: 0.75;
}

.rcs-seg-btn.is-active {
  background: var(--studio-accent);
  color: #fff;
}

/* Crop Diagnostic Box */
.rcs-crop-diagnostic {
  display: grid;
  grid-template-columns: 118px 1fr;
  gap: 8px;
  align-items: center;
  background: var(--studio-panel);
  border: 1px solid var(--studio-border-subtle);
  border-radius: 6px;
  padding: 6px;
}

.rcs-crop-minimap {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #090d12;
  border-radius: 4px;
  height: 76px;
  padding: 4px;
  overflow: hidden;
}

.rcs-crop-stage {
  position: relative;
  max-width: 100%;
  max-height: 100%;
  width: 100%;
  background-size: cover;
  background-position: center;
  border-radius: 3px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px dashed rgba(239, 68, 68, 0.7);
}

.rcs-crop-mask {
  border: 1.5px solid #22c55e;
  background: rgba(34, 197, 94, 0.14);
  box-shadow: 0 0 0 999px rgba(239, 68, 68, 0.42);
  display: flex;
  align-items: center;
  justify-content: center;
}

.rcs-crop-safe-tag {
  font-size: 8px;
  font-weight: 800;
  color: #fff;
  background: rgba(15, 23, 42, 0.78);
  padding: 1px 4px;
  border-radius: 2px;
  letter-spacing: 0.03em;
}

.rcs-crop-stats {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.rcs-spec-pill {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-size: 11px;
  gap: 6px;
}

.rcs-spec-k {
  color: var(--studio-text-muted);
}

.rcs-spec-v {
  color: var(--studio-text);
  font-size: 10.5px;
}

.rcs-spec-v.is-ok {
  color: #34d399;
}

.rcs-spec-v.is-warn {
  color: #fbbf24;
}

.rcs-upload-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 3px;
  flex-wrap: wrap;
}

.rcs-upload-btn,
.rcs-btn-ghost,
.rcs-btn-primary,
.rcs-icon-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 5px;
  cursor: pointer;
  border: 1px solid var(--studio-border);
  background: var(--studio-panel-elevated);
  color: var(--studio-text);
  transition: all 0.12s ease;
}

.rcs-upload-btn:hover,
.rcs-btn-ghost:hover,
.rcs-icon-btn:hover {
  border-color: #475569;
  background: #263142;
}

.rcs-btn-primary {
  background: var(--studio-accent);
  border-color: var(--studio-accent);
  color: #fff;
}

.rcs-btn-primary:hover {
  background: var(--studio-accent-hover);
}

.rcs-icon-btn.is-active {
  background: var(--studio-accent-soft);
  border-color: var(--studio-accent);
  color: #38bdf8;
}

.rcs-icon-btn.is-active-warn {
  background: rgba(245, 158, 11, 0.18);
  border-color: var(--studio-warn);
  color: #fbbf24;
}

/* Inputs & Character Meters */
.rcs-field-group {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.rcs-label-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.rcs-field-label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 600;
  color: #cbd5e1;
}

.rcs-micro-hint {
  font-size: 10px;
  color: var(--studio-text-dim);
}

.rcs-input,
.rcs-textarea,
.rcs-select-compact {
  background: var(--studio-panel);
  border: 1px solid var(--studio-border);
  border-radius: 5px;
  color: var(--studio-text);
  font-family: inherit;
  font-size: 12px;
  padding: 5px 7px;
  outline: none;
}

.rcs-input:focus,
.rcs-textarea:focus,
.rcs-select-compact:focus {
  border-color: var(--studio-accent);
}

.rcs-textarea {
  resize: vertical;
  min-height: 48px;
}

.rcs-meter-wrap {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.rcs-meter-bar {
  height: 3px;
  background: #1e293b;
  border-radius: 2px;
  overflow: hidden;
}

.rcs-meter-fill {
  height: 100%;
  transition: width 0.15s ease;
}

.rcs-meter-fill.is-ok {
  background: var(--studio-ok);
}

.rcs-meter-fill.is-warn {
  background: var(--studio-warn);
}

.rcs-meter-fill.is-danger {
  background: var(--studio-danger);
}

.rcs-meter-meta {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--studio-text-muted);
}

.rcs-meter-badge.is-ok { color: #34d399; }
.rcs-meter-badge.is-warn { color: #fbbf24; }
.rcs-meter-badge.is-danger { color: #f87171; }

/* Suggestions Editor List */
.rcs-suggestions-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.rcs-sug-row {
  display: grid;
  grid-template-columns: 112px 1.1fr 1fr auto auto;
  gap: 4px;
  align-items: center;
}

.rcs-sug-type {
  background: var(--studio-panel);
  border: 1px solid var(--studio-border);
  color: var(--studio-text);
  border-radius: 5px;
  padding: 4px;
  font-size: 11px;
}

.rcs-sug-input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.rcs-sug-input-wrap .rcs-input {
  width: 100%;
  padding-right: 36px;
}

.rcs-sug-counter {
  position: absolute;
  right: 6px;
  font-size: 9.5px;
  color: var(--studio-text-dim);
}

.rcs-sug-counter.is-warn { color: var(--studio-warn); }
.rcs-sug-counter.is-danger { color: var(--studio-danger); font-weight: 700; }

.rcs-sug-del {
  background: transparent;
  border: 1px solid transparent;
  color: var(--studio-text-dim);
  padding: 3px;
  border-radius: 4px;
  cursor: pointer;
}

.rcs-sug-del:hover {
  color: var(--studio-danger);
  background: rgba(239, 68, 68, 0.12);
}

/* Agent Tab & Toggles */
.rcs-agent-banner {
  padding: 5px 8px;
  border-radius: 5px;
  font-size: 11px;
  font-weight: 600;
}

.rcs-agent-banner.is-detected {
  background: rgba(16, 185, 129, 0.12);
  color: #34d399;
  border: 1px solid rgba(16, 185, 129, 0.3);
}

.rcs-agent-banner.is-fallback {
  background: rgba(245, 158, 11, 0.14);
  color: #fbbf24;
  border: 1px solid rgba(245, 158, 11, 0.3);
}

.rcs-agent-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.rcs-color-row {
  display: flex;
  align-items: center;
  gap: 4px;
}

.rcs-color-picker {
  width: 28px;
  height: 28px;
  padding: 0;
  border: 1px solid var(--studio-border);
  border-radius: 4px;
  background: none;
  cursor: pointer;
}

.rcs-hex-input {
  width: 76px;
  font-family: monospace;
}

.rcs-chrome-toggles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
}

.rcs-toggle-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: #cbd5e1;
  cursor: pointer;
  user-select: none;
}

.rcs-sms-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 4px;
}

.rcs-sms-pill {
  font-size: 10.5px;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--studio-panel);
  border: 1px solid var(--studio-border);
  color: var(--studio-text-muted);
}

.rcs-sms-pill.is-ok strong { color: #34d399; }
.rcs-sms-pill.is-warn strong { color: #fbbf24; }

.rcs-flow-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.rcs-json-pre {
  margin: 0;
  padding: 8px;
  background: #090d12;
  border: 1px solid var(--studio-border);
  border-radius: 5px;
  font-size: 10.5px;
  color: #93c5fd;
  max-height: 360px;
  overflow: auto;
}

/* ==========================================================================
   Module 2: RcsPhonePreview Styles (Authentic Phone & OS Simulation)
   ========================================================================== */
.rcs-toolbar-group {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}

.rcs-zoom-bar {
  display: inline-flex;
  align-items: center;
  background: var(--studio-panel);
  border: 1px solid var(--studio-border);
  border-radius: 5px;
  overflow: hidden;
}

.rcs-zoom-btn {
  background: transparent;
  border: none;
  color: var(--studio-text-muted);
  padding: 3px 5px;
  cursor: pointer;
  display: inline-flex;
}

.rcs-zoom-btn:hover {
  color: #fff;
  background: var(--studio-panel-elevated);
}

.rcs-zoom-readout {
  background: transparent;
  border: none;
  border-left: 1px solid var(--studio-border);
  border-right: 1px solid var(--studio-border);
  color: var(--studio-text);
  font-size: 10.5px;
  font-weight: 700;
  padding: 3px 6px;
  cursor: pointer;
}

.rcs-device-subbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 10px;
  background: #10151d;
  border-bottom: 1px solid var(--studio-border);
  font-size: 10.5px;
  color: var(--studio-text-muted);
  flex-shrink: 0;
  gap: 8px;
  flex-wrap: wrap;
}

.rcs-gesture-hint {
  color: #38bdf8;
}

.rcs-stage-wrap {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 8px;
  overflow: auto;
  background: radial-gradient(circle at center, #1b2432 0%, #0f141c 100%);
}

.rcs-phone-scale-container {
  position: relative;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  flex-shrink: 0;
}

/* Phone Physical Bezel & Screen Variables */
.rcs-phone-hardware {
  position: relative;
  transform: scale(var(--phone-scale, 0.76));
  transform-origin: top center;
  background: #ffffff;
  color: #1f1f1f;
  border: 10px solid #1e242d;
  box-shadow:
    0 0 0 2px #3b4454,
    0 20px 50px rgba(0, 0, 0, 0.65);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
  font-family: 'Roboto', system-ui, -apple-system, sans-serif;
}

/* Theme Palettes (Google Messages Material 3 Light & Dark) */
.rcs-phone-hardware.is-theme-light {
  --app-bg: #ffffff;
  --app-surface: #eff2f7;
  --app-surface-2: #e8edf4;
  --app-text: #1f1f1f;
  --app-text-sub: #444746;
  --app-border: #e1e3e6;
  --card-bg: #eff2f7;
  --action-btn-bg: #ffffff;
  --action-ico-bg: #e8edf4;
  --verified-color: #1b6ef3;
  --voice-fab-bg: #c4eed0;
  --voice-fab-fg: #0f5223;
}

.rcs-phone-hardware.is-theme-dark {
  --app-bg: #111318;
  --app-surface: #1e232c;
  --app-surface-2: #282f3d;
  --app-text: #e3e3e3;
  --app-text-sub: #9aa0a6;
  --app-border: #2d323b;
  --card-bg: #1e232c;
  --action-btn-bg: #2b313e;
  --action-ico-bg: #384050;
  --verified-color: #669df6;
  --voice-fab-bg: #1e5631;
  --voice-fab-fg: #bbf7d0;
  background: var(--app-bg);
  color: var(--app-text);
}

/* Camera Cutouts */
.rcs-hw-cutout {
  position: absolute;
  top: 7px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  pointer-events: none;
}

.rcs-phone-hardware.is-cutout-punch-center .rcs-hw-cutout {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #090b0e;
}

.rcs-phone-hardware.is-cutout-punch-center-small .rcs-hw-cutout {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #090b0e;
}

.rcs-phone-hardware.is-cutout-dynamic-island .rcs-hw-cutout {
  top: 6px;
  width: 92px;
  height: 22px;
  border-radius: 14px;
  background: #050608;
}

.rcs-phone-hardware.is-cutout-fold-crease::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 2px;
  background: linear-gradient(to right, rgba(0,0,0,0.06), rgba(255,255,255,0.08), rgba(0,0,0,0.06));
  pointer-events: none;
  z-index: 25;
}

/* 1. OS Status Bar (Matches 12:04 + 4G + Battery in user screenshots) */
.rcs-os-statusbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 30px;
  padding: 4px 18px 0;
  background: var(--app-bg);
  color: var(--app-text);
  font-size: 12.5px;
  font-weight: 600;
  flex-shrink: 0;
}

.rcs-status-right {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--app-text);
}

.rcs-status-net {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.rcs-status-battery {
  width: 8px;
  height: 13px;
  border: 1.4px solid currentColor;
  border-radius: 2px;
  padding: 1px;
  display: flex;
  align-items: flex-end;
  position: relative;
}

.rcs-status-battery::before {
  content: '';
  position: absolute;
  top: -3px;
  left: 1.5px;
  right: 1.5px;
  height: 2px;
  background: currentColor;
}

.rcs-battery-fill {
  width: 100%;
  background: currentColor;
}

/* 2. Messaging App Top Header (Matches Google Messages, Samsung One UI, iOS 18) */
.rcs-app-header {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 54px;
  padding: 0 10px;
  background: var(--app-bg);
  color: var(--app-text);
  flex-shrink: 0;
}

.rcs-nav-icon-btn {
  background: transparent;
  border: none;
  color: var(--app-text);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.rcs-header-avatar {
  width: 36px;
  height: 36px;
  object-fit: cover;
  flex-shrink: 0;
}

.rcs-header-avatar.is-rounded {
  border-radius: 10px;
}

.rcs-header-avatar.is-circle {
  border-radius: 50%;
}

.rcs-header-title-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 5px;
}

.rcs-header-title {
  font-size: 17px;
  font-weight: 500;
  color: var(--app-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rcs-verified-badge {
  display: inline-flex;
  width: 18px;
  height: 18px;
  color: var(--verified-color);
  flex-shrink: 0;
}

.rcs-verified-badge svg {
  width: 100%;
  height: 100%;
}

/* iOS 18 Header Variant */
.rcs-app-header.is-ios {
  height: 64px;
  justify-content: space-between;
  border-bottom: 1px solid var(--app-border);
  padding: 0 14px;
}

.rcs-nav-back-ios,
.rcs-nav-info-ios {
  background: none;
  border: none;
  color: #007aff;
  font-size: 24px;
  cursor: pointer;
}

.rcs-ios-center-brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.rcs-ios-center-brand .rcs-header-avatar {
  width: 32px;
  height: 32px;
}

.rcs-ios-brand-row {
  display: flex;
  align-items: center;
  gap: 3px;
}

.rcs-ios-brand-row .rcs-header-title {
  font-size: 12px;
  font-weight: 600;
}

/* 3. Scrollable Conversation Feed */
.rcs-chat-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 6px 8px 14px;
  background: var(--app-bg);
  display: flex;
  flex-direction: column;
  gap: 8px;
  scroll-behavior: smooth;
}

/* Large Agent Profile Header (Matches TIPOS Screenshot_20260617-120218.png) */
.rcs-agent-hero-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 14px 18px 16px;
  margin: 0 -8px 4px;
  border-bottom: 1px solid var(--app-border);
}

.rcs-agent-hero-logo {
  width: 68px;
  height: 68px;
  object-fit: cover;
  margin-bottom: 10px;
}

.rcs-agent-hero-logo.is-rounded {
  border-radius: 16px;
}

.rcs-agent-hero-logo.is-circle {
  border-radius: 50%;
}

.rcs-agent-hero-title {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 17px;
  font-weight: 500;
  color: var(--app-text);
  margin-bottom: 6px;
}

.rcs-agent-hero-tagline {
  margin: 0;
  font-size: 12.5px;
  line-height: 1.4;
  color: var(--app-text-sub);
  max-width: 310px;
}

.rcs-chat-timestamp,
.rcs-chat-system-notice {
  text-align: center;
  font-size: 11.5px;
  color: var(--app-text-sub);
  margin: 2px 0;
}

/* Message Container & Rich Card (Matches Google Messages M3) */
.rcs-message-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.rcs-stacked-cards-feed {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.rcs-rich-card {
  background: var(--card-bg);
  border-radius: 18px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  animation: rcsBubbleIn 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}

/* Samsung One UI Skin Variation */
.rcs-phone-hardware.is-skin-samsung_messages_oneui .rcs-rich-card {
  border-radius: 22px;
  border: 1px solid var(--app-border);
}

/* Apple iOS 18 Skin Variation */
.rcs-phone-hardware.is-skin-ios_18_messages .rcs-rich-card {
  border-radius: 20px;
}

.rcs-card-media-wrap {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #cbd5e1;
  cursor: zoom-in;
}

.rcs-card-media-el {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}

.rcs-media-type-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(15, 23, 42, 0.78);
  color: #fff;
  font-size: 9.5px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 4px;
}

/* Safe-Zone Crop Guide Overlay inside Phone Preview */
.rcs-preview-crop-overlay {
  position: absolute;
  inset: 0;
  border: 2px dashed rgba(245, 158, 11, 0.85);
  display: flex;
  align-items: flex-end;
  justify-content: flex-end;
  padding: 6px;
  pointer-events: none;
}

.rcs-preview-crop-safe {
  background: rgba(15, 23, 42, 0.82);
  color: #fbbf24;
  font-size: 9.5px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
}

.rcs-card-content {
  padding: 13px 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.rcs-card-title {
  margin: 0;
  font-size: 15.5px;
  font-weight: 500;
  line-height: 1.3;
  color: var(--app-text);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.rcs-card-desc {
  font-size: 13.8px;
  line-height: 1.42;
  color: var(--app-text);
  word-break: break-word;
}

.rcs-more-link {
  background: none;
  border: none;
  color: var(--verified-color);
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  padding: 0 4px;
}

/* Stacked White Pill Action Buttons (Exact match to DOXXbet & Telekom screenshots!) */
.rcs-card-actions-stack {
  display: flex;
  flex-direction: column;
  gap: 3px;
  margin-top: 4px;
}

.rcs-card-action-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 46px;
  padding: 7px 14px 7px 9px;
  background: var(--action-btn-bg);
  color: var(--app-text);
  border: none;
  border-radius: 16px;
  font-family: inherit;
  font-size: 13.8px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  transition: transform 0.1s ease, filter 0.12s ease;
}

.rcs-card-action-btn:hover {
  filter: brightness(0.97);
}

.rcs-card-action-btn:active {
  transform: scale(0.985);
}

.rcs-action-circle-ico {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--action-ico-bg);
  color: var(--app-text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.rcs-action-label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Rich Card Carousel (Matches Telekom Screenshot_20260617-120327.png with peeking neighbor cards!) */
.rcs-carousel-track {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin: 0 -8px;
  padding: 2px 34px 4px;
  scroll-snap-type: x mandatory;
  cursor: grab;
  scrollbar-width: none;
}

.rcs-carousel-track::-webkit-scrollbar {
  display: none;
}

.rcs-carousel-track.is-dragging {
  cursor: grabbing;
  scroll-snap-type: none;
}

.rcs-rich-card.is-carousel-item {
  width: var(--carousel-card-w, 264px);
  min-width: var(--carousel-card-w, 264px);
  flex-shrink: 0;
  scroll-snap-align: center;
  justify-content: space-between;
}

.rcs-rich-card.is-carousel-item .rcs-card-content {
  flex: 1;
  justify-content: space-between;
}

/* Horizontal Rich Card (Left / Right Side Thumbnail) */
.rcs-rich-card.is-horizontal {
  padding: 12px;
  gap: 10px;
}

.rcs-horiz-top {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.rcs-rich-card.is-align-right .rcs-horiz-top {
  flex-direction: row-reverse;
}

.rcs-horiz-thumb {
  position: relative;
  width: 106px;
  height: 118px;
  border-radius: 12px;
  overflow: hidden;
  flex-shrink: 0;
  cursor: zoom-in;
}

.rcs-horiz-copy {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

/* Conversational Text + Floating Suggestion Chips */
.rcs-plain-rcs-bubble {
  background: var(--card-bg);
  padding: 11px 14px;
  border-radius: 18px 18px 18px 6px;
  max-width: 88%;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.rcs-chips-scroll {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 6px 2px 2px;
}

.rcs-floating-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 13px;
  border-radius: 18px;
  background: var(--app-bg);
  border: 1px solid var(--app-border);
  color: var(--app-text);
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}

/* SMS Fallback Bubble */
.rcs-sms-bubble-card {
  background: var(--card-bg);
  padding: 12px 14px;
  border-radius: 18px 18px 18px 4px;
  max-width: 90%;
  border-left: 3px solid #f59e0b;
}

.rcs-sms-text {
  font-size: 13.8px;
  line-height: 1.42;
  color: var(--app-text);
}

.rcs-sms-meta-tag {
  margin-top: 6px;
  font-size: 10.5px;
  color: var(--app-text-sub);
  font-weight: 600;
}

.rcs-msg-delivery-time {
  font-size: 11px;
  color: var(--app-text-sub);
  padding-left: 10px;
}

/* Interactive User / Agent Reply Bubbles */
.rcs-chat-bubble-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
  animation: rcsBubbleIn 0.25s cubic-bezier(0.22, 1, 0.36, 1);
}

.rcs-chat-bubble-row.is-user {
  align-items: flex-end;
}

.rcs-chat-bubble-row.is-agent {
  align-items: flex-start;
}

.rcs-chat-bubble {
  max-width: 82%;
  padding: 9px 14px;
  border-radius: 18px;
  font-size: 13.8px;
  line-height: 1.38;
}

.rcs-chat-bubble.is-user {
  background: var(--user-bubble-bg, #0b57d0);
  color: #ffffff;
  border-bottom-right-radius: 4px;
}

.rcs-chat-bubble.is-agent {
  background: var(--card-bg);
  color: var(--app-text);
  border-bottom-left-radius: 4px;
}

.rcs-bubble-time {
  font-size: 10px;
  color: var(--app-text-sub);
  padding: 0 6px;
}

/* Animated Typing Indicator */
.rcs-typing-indicator {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--card-bg);
  padding: 10px 14px;
  border-radius: 16px;
  width: fit-content;
}

.rcs-typing-indicator span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--app-text-sub);
  animation: rcsTypingBounce 1.1s infinite ease-in-out;
}

.rcs-typing-indicator span:nth-child(2) { animation-delay: 0.18s; }
.rcs-typing-indicator span:nth-child(3) { animation-delay: 0.36s; }

/* Floating Scroll-to-Bottom Button (Matches TIPOS screenshot) */
.rcs-floating-scroll-btn {
  position: absolute;
  bottom: 72px;
  left: 50%;
  transform: translateX(-50%);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--action-btn-bg);
  color: var(--app-text);
  border: 1px solid var(--app-border);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 15;
}

/* Spam & Safety Shield Banner (Matches Telekom screenshot) */
.rcs-spam-shield-banner {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 12px 6px;
  padding: 8px 12px;
  background: var(--app-surface);
  border-radius: 22px;
  font-size: 12px;
  color: var(--app-text);
  flex-shrink: 0;
}

.rcs-shield-ico {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #0b57d0;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.rcs-shield-ico .rcs-ico {
  width: 15px;
  height: 15px;
}

.rcs-shield-text {
  flex: 1;
}

.rcs-shield-link {
  color: #0b57d0;
  text-decoration: underline;
  font-weight: 500;
}

.rcs-shield-close {
  background: none;
  border: none;
  color: var(--app-text-sub);
  font-size: 14px;
  cursor: pointer;
}

/* 4. Bottom Compose Bar (Matches Google Messages screenshot) */
.rcs-compose-bar {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 4px 10px 6px;
  background: var(--app-bg);
  flex-shrink: 0;
}

.rcs-google-input-pill {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  height: 44px;
  padding: 0 10px;
  background: var(--app-surface);
  border-radius: 24px;
}

.rcs-compose-ico-btn {
  background: none;
  border: none;
  color: var(--app-text-sub);
  padding: 2px;
  display: inline-flex;
  cursor: pointer;
}

.rcs-compose-input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: var(--app-text);
  font-size: 14px;
  font-family: inherit;
}

.rcs-compose-input::placeholder {
  color: var(--app-text-sub);
}

.rcs-voice-fab {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--voice-fab-bg);
  color: var(--voice-fab-fg);
  border: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}

/* iOS Compose Bar */
.rcs-compose-bar.is-ios {
  padding: 6px 12px;
}

.rcs-ios-plus-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--app-surface);
  border: none;
  color: var(--app-text-sub);
  font-size: 20px;
  cursor: pointer;
}

.rcs-ios-input-pill {
  flex: 1;
  display: flex;
  align-items: center;
  height: 34px;
  padding: 0 12px;
  border-radius: 18px;
  border: 1px solid var(--app-border);
  background: var(--app-bg);
}

/* 5. Bottom Gesture Bar */
.rcs-os-gesture-bar {
  height: 16px;
  background: var(--app-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.rcs-gesture-pill {
  width: 120px;
  height: 4px;
  border-radius: 2px;
  background: var(--app-text-sub);
  opacity: 0.55;
}

/* In-Phone Modal Overlays (Lightbox / Webview / Custom Preset) */
.rcs-phone-modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(9, 13, 20, 0.76);
  z-index: 40;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: rcsFadeIn 0.16s ease;
}

.rcs-lightbox-sheet,
.rcs-action-sheet {
  width: 100%;
  background: var(--app-bg);
  color: var(--app-text);
  border-radius: 20px 20px 0 0;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 85%;
}

.rcs-sheet-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13.5px;
  font-weight: 600;
}

.rcs-sheet-close {
  background: var(--app-surface);
  border: none;
  color: var(--app-text);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  cursor: pointer;
}

.rcs-lightbox-img {
  width: 100%;
  max-height: 420px;
  object-fit: contain;
  border-radius: 10px;
  background: #000;
}

.rcs-lightbox-foot {
  font-size: 11px;
  color: var(--app-text-sub);
  text-align: center;
}

.rcs-webview-url-bar {
  background: var(--app-surface);
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 11.5px;
  color: var(--app-text-sub);
  font-family: monospace;
}

.rcs-ref-pill.is-active {

.rcs-ref-img-wrap {
  flex: 1;
  overflow: auto;

  align-items: flex-start;
  justify-content: center;
  padding: 6px;
}

.rcs-ref-img {
  max-width: 100%;
  height: auto;
  border-radius: 8px;
}

.rcs-telemetry-footer {
  height: 28px;
  padding: 0 12px;
  background: #0b0f16;
  border-top: 1px solid var(--studio-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--studio-text-muted);
  flex-shrink: 0;

.rcs-telemetry-stream {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  white-space: nowrap;
}

.rcs-telemetry-badge {
  color: #34d399;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.rcs-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
}

@keyframes rcsBubbleIn {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes rcsTypingBounce {
  0%, 80%, 100% { transform: scale(0.75); opacity: 0.45; }
  40% { transform: scale(1.1); opacity: 1; }

@keyframes rcsFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }

  font-weight: 600;
  cursor: pointer;
  transition: all 0.12s ease;
}

.rcs-slot-chip-btn:hover {
  background: var(--verified-color);
  color: #ffffff;
}

/* ==========================================================================
   Custom Hand Cursor, Tapping Hand Icon, & Blue Touch-Area Overlay
   ========================================================================== */
.rcs-touch-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 90;
  overflow: hidden;
  opacity: 0;
  transition: opacity 0.12s ease;
}

.rcs-touch-overlay.is-visible {
  opacity: 1;
}

/* Blue Circular Overlay in the Screen Area Being Touched */
.rcs-touch-blue-area {
  position: absolute;
  width: 52px;
  height: 52px;
  margin-left: -26px;
  margin-top: -26px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(14, 165, 233, 0.46) 0%, rgba(2, 132, 199, 0.22) 70%, rgba(2, 132, 199, 0) 100%);
  border: 2px solid rgba(56, 189, 248, 0.92);
  box-shadow: 0 0 16px rgba(14, 165, 233, 0.55);
  transform: scale(0.35);
  opacity: 0;
  transition: transform 0.12s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.12s ease;
  pointer-events: none;
}

.rcs-touch-overlay.is-tapping .rcs-touch-blue-area {
  transform: scale(1);
  opacity: 1;
}

/* Expanding Blue Ripple on Tap */
.rcs-touch-ripple {
  position: absolute;
  width: 54px;
  height: 54px;
  margin-left: -27px;
  margin-top: -27px;
  border-radius: 50%;
  background: rgba(14, 165, 233, 0.36);
  border: 2px solid rgba(56, 189, 248, 0.9);
  pointer-events: none;
  animation: rcsTouchRipple 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Custom Hand Cursor Following the Pointer (Index Fingertip Aligned at x,y) */
.rcs-touch-cursor {
  position: absolute;
  width: 32px;
  height: 32px;
  margin-left: -14px;
  margin-top: -4px;
  pointer-events: none;
  filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.42));
  transition: transform 0.09s ease;
}

.rcs-hand-svg.is-tap-hand {
  display: none;
}

.rcs-touch-overlay.is-tapping .rcs-hand-svg.is-hover-hand {
  display: none;
}

.rcs-touch-overlay.is-tapping .rcs-hand-svg.is-tap-hand {
  display: block;
}

.rcs-touch-overlay.is-tapping .rcs-touch-cursor {
  transform: translateY(2px) scale(0.92) rotate(-8deg);
}

@keyframes rcsTouchRipple {
  0% {
    transform: scale(0.5);
    opacity: 0.95;
  }
  100% {
    transform: scale(1.65);
    opacity: 0;
  }
}

@media (max-width: 960px) {

    height: auto;
    max-height: none;
    overflow: auto;
  }

    grid-template-columns: 1fr;
    overflow: visible;

}

 * Rich SVG Data-URI illustrations & real screenshot presets so everything works
 * offline, in GitHub Pages, and without external broken image links.

function createSvgBannerDataUri({ bg1, bg2, accent, title, subtitle, badge, emoji }) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
    <defs>
      <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="${bg1}"/>
        <stop offset="100%" stop-color="${bg2}"/>
      </linearGradient>
      <radialGradient id="r" cx="80%" cy="25%" r="55%">
        <stop offset="0%" stop-color="${accent}" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="${bg2}" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1200" height="800" fill="url(#g)"/>
    <rect width="1200" height="800" fill="url(#r)"/>
    <circle cx="1020" cy="180" r="240" fill="${accent}" opacity="0.18"/>
    <circle cx="160" cy="680" r="290" fill="${accent}" opacity="0.14"/>
    <g transform="translate(80, 95)">
      <rect x="0" y="0" width="260" height="58" rx="14" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <text x="24" y="38" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" letter-spacing="1">${badge}</text>
    </g>
    <text x="920" y="470" font-family="system-ui, sans-serif" font-size="250" text-anchor="middle">${emoji}</text>
    <g transform="translate(80, 320)">
      <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="78" font-weight="900" letter-spacing="-1">${title}</text>
      <rect x="0" y="55" width="660" height="120" rx="26" fill="${accent}"/>
      <text x="36" y="132" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="60" font-weight="900">${subtitle}</text>
    </g>
  </svg>`;
  return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
}

function createLogoSvgDataUri({ bg, text, fg = '#ffffff', sub = '' }) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
    <rect width="160" height="160" rx="36" fill="${bg}"/>
    <text x="80" y="${sub ? '88' : '102'}" fill="${fg}" font-family="system-ui, -apple-system, sans-serif" font-size="62" font-weight="900" text-anchor="middle">${text}</text>
    ${sub ? `<text x="80" y="126" fill="${fg}" opacity="0.85" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">${sub}</text>` : ''}
  </svg>`;
  return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
}

/**
 * Compute SMS segment count and encoding (GSM-7 vs UCS-2)
 */
function analyzeSmsSegments(text = '') {
  // Basic GSM-7 character check
  const gsm7Regex = /^[@£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ !"#¤%&'()*+,\-./0-9:;<=>?¡A-ZÄÖÑÜ§¿a-zäöñüà^{}\\[~\]|€]*$/;
  const isGsm7 = gsm7Regex.test(text);
  const length = Array.from(text).length;
  const singleLimit = isGsm7 ? TEXT_LIMITS.smsFallback.gsmSingle : TEXT_LIMITS.smsFallback.ucsSingle;
  const multiLimit = isGsm7 ? TEXT_LIMITS.smsFallback.gsmMulti : TEXT_LIMITS.smsFallback.ucsMulti;
  const segments = length === 0 ? 0 : length <= singleLimit ? 1 : Math.ceil(length / multiLimit);
  const remaining = length <= singleLimit
    ? singleLimit - length
    : (segments * multiLimit) - length;

  return {
    encoding: isGsm7 ? 'GSM-7' : 'UCS-2 (Unicode)',
    length,
    segments,
    singleLimit,
    multiLimit,
    remaining
  };
}

/**
 * Evaluate media fit & crop percentage against target RCS media height/orientation
 */
function evaluateMediaCrop(dimensions, mediaHeightKey = 'MEDIUM', isCarousel = false, cardWidthKey = 'MEDIUM') {
  const spec = MEDIA_SPECS[mediaHeightKey] || MEDIA_SPECS.MEDIUM;
  let targetRatio = spec.aspectRatio;

  if (isCarousel) {
    const cWidth = CAROUSEL_WIDTH_SPECS[cardWidthKey]?.dpWidth || 264;
    const cHeight = spec.dpHeight || 168;
    targetRatio = cWidth / cHeight;
  }

  const srcW = dimensions?.width || spec.recWidthPx;
  const srcH = dimensions?.height || spec.recHeightPx;
  const srcRatio = srcW / srcH;

  let cropAxis = 'none';
  let visibleFraction = 1;
  let croppedPercent = 0;

  if (Math.abs(srcRatio - targetRatio) > 0.03) {
    if (srcRatio > targetRatio) {
      // Source is wider than container -> left & right sides are cropped
      cropAxis = 'horizontal';
      visibleFraction = targetRatio / srcRatio;
    } else {
      // Source is taller than container -> top & bottom are cropped
      cropAxis = 'vertical';
      visibleFraction = srcRatio / targetRatio;
    }
    croppedPercent = Math.round((1 - visibleFraction) * 100);
  }

  return {
    spec,
    srcW,
    srcH,
    srcRatio,
    targetRatio,
    cropAxis,
    visibleFraction,
    croppedPercent,
    recText: `${spec.recWidthPx}×${spec.recHeightPx}px (${spec.aspectLabel}) • max ${Math.round(spec.maxImageKb / 1024 * 10) / 10}MB`
  };
}

/**
 * @fileoverview Agnostic RCS Template Chooser & Content/Agent Configurator Module.
 * Can be mounted standalone in any DOM container via `new RcsTemplateChooser(el, opts)`
 * or used as a Web Component `<rcs-template-chooser>`.
 * Communicates via standard CustomEvents (`rcs:change`, `rcs:template-select`, `rcs:crop-overlay-toggle`, `rcs:simulate-flow`).
 */




class RcsTemplateChooser {
  /**
   * @param {HTMLElement|string} container
   * @param {Object} options
   */
  constructor(container, options = {}) {
    this.root = typeof container === 'string' ? document.querySelector(container) : container;
    if (!this.root) {
      throw new Error('RcsTemplateChooser: valid target container element is required.');
    }

    const defaultPreset = REAL_CAMPAIGN_PRESETS[options.initialPreset || 'hospital_preventive_carousel'];
    this.state = {
      activePresetId: defaultPreset.id,
      activeSubTab: 'content', // 'content' | 'agent' | 'fallback' | 'json'
      activeCardIndex: 0,
      showCropGuides: true,
      agentDetected: true,
      agent: structuredClone(options.agent || defaultPreset.agent),
      payload: structuredClone(options.payload || defaultPreset.payload)
    };

    this.onChange = typeof options.onChange === 'function' ? options.onChange : null;
    this.onTriggerFlow = typeof options.onTriggerFlow === 'function' ? options.onTriggerFlow : null;

    this.render();
    this.attachEvents();
    this.emitChange('init');
  }

  /**
   * Public API: Get current complete state (payload + agent + crop config)
   */
  getState() {
    return structuredClone(this.state);
  }

  /**
   * Public API: Load one of the real campaign presets or custom state
   */
  loadPreset(presetId) {
    const preset = REAL_CAMPAIGN_PRESETS[presetId];
    if (!preset) return;
    this.state.activePresetId = preset.id;
    this.state.activeCardIndex = 0;
    this.state.agent = structuredClone(preset.agent);
    this.state.payload = structuredClone(preset.payload);
    this.render();
    this.attachEvents();
    this.emitChange('preset-load');
  }

  /**
   * Public API: Simulate auto-detecting Agent Branding from an external RBM Agent object
   * or falling back to a generic white-label agent if not detected.
   */
  setAgentFromExternal(agentData = null) {
    if (agentData && agentData.name) {
      this.state.agentDetected = true;
      this.state.agent = {
        ...this.state.agent,
        ...agentData
      };
    } else {
      this.state.agentDetected = false;
      this.state.agent = {
        name: 'Generic Business Agent',
        verified: false,
        tagline: 'Automated RCS Business Messaging Service (Fallback Agent Profile)',
        color: '#475569',
        avatarShape: 'rounded',
        logoUrl: `data:image/svg+xml;utf8,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160"><rect width="160" height="160" rx="36" fill="#475569"/><text x="80" y="98" fill="#ffffff" font-family="system-ui, sans-serif" font-size="56" font-weight="800" text-anchor="middle">RCS</text></svg>')}`,
        showAgentHeader: true,
        showRbmChatNotice: true,
        timestampLabel: 'Today • 12:00',
        messageTime: '12:00',
        showSpamBanner: false,
        showScrollDownBtn: false
      };
    }
    this.render();
    this.attachEvents();
    this.emitChange('agent-detect');
  }

  emitChange(reason = 'update') {
    const detail = {
      reason,
      state: this.getState(),
      agent: structuredClone(this.state.agent),
      payload: structuredClone(this.state.payload),
      showCropGuides: this.state.showCropGuides
    };
    this.root.dispatchEvent(new CustomEvent('rcs:change', { detail, bubbles: true, composed: true }));
    if (this.onChange) {
      this.onChange(detail);
    }
  }

  getCurrentCard() {
    const cards = this.state.payload.cards || [];
    if (!cards.length) {
      cards.push({
        id: `card-${Date.now()}`,
        mediaUrl: '',
        mediaType: 'image',
        mediaSizeKb: 250,
        mediaDimensions: { width: 1440, height: 720 },
        title: 'Card Title',
        description: 'Card description text.',
        suggestions: []
      });
    }
    if (this.state.activeCardIndex >= cards.length) {
      this.state.activeCardIndex = 0;
    }
    return cards[this.state.activeCardIndex];
  }

  selectTemplate(templateId) {
    const tpl = TEMPLATES.find((t) => t.id === templateId);
    if (!tpl) return;

    this.state.payload.templateId = tpl.id;
    this.state.payload.channel = tpl.channel;
    this.state.payload.mediaHeight = tpl.defaultMediaHeight;

    if (tpl.id === 'carousel' || tpl.id === 'multi_card_feed') {
      if (this.state.payload.cards.length < 2) {
        const first = structuredClone(this.getCurrentCard());
        first.id = `card-${Date.now()}-2`;
        first.title = 'Second Offer Card ✨';
        this.state.payload.cards.push(first);
      }
    }

    this.render();
    this.attachEvents();
    this.emitChange('template-select');
  }

  renderCharMeter(text = '', limitSpec) {
    const len = Array.from(text || '').length;
    const rec = limitSpec.recommended;
    const max = limitSpec.max;
    const pct = Math.min(100, Math.round((len / max) * 100));
    let statusClass = 'ok';
    let statusText = `Optimal (≤ ${rec})`;
    if (len > max) {
      statusClass = 'danger';
      statusText = `Exceeds max (${max})!`;
    } else if (len > rec) {
      statusClass = 'warn';
      statusText = `Long (> ${rec} chars may wrap/fold)`;
    }

    return `
      <div class="rcs-meter-wrap">
        <div class="rcs-meter-bar">
          <div class="rcs-meter-fill is-${statusClass}" style="width:${pct}%"></div>
        </div>
        <div class="rcs-meter-meta">
          <span class="rcs-meter-badge is-${statusClass}">${statusText}</span>
          <span class="rcs-meter-count"><strong>${len}</strong> / ${ rec } rec (${max} max)</span>
        </div>
      </div>
    `;
  }

  render() {
    const { payload, agent, activeSubTab, activeCardIndex, showCropGuides, activePresetId, agentDetected } = this.state;
    const currentTemplate = TEMPLATES.find((t) => t.id === payload.templateId) || TEMPLATES[0];
    const card = this.getCurrentCard();
    const isMulti = payload.templateId === 'carousel' || payload.templateId === 'multi_card_feed';
    const isCarousel = payload.templateId === 'carousel';
    const isHorizontal = payload.templateId === 'standalone_horizontal';
    const isTextOnly = payload.templateId === 'text_with_chips';
    const isSms = payload.templateId === 'sms_regular';

    const cropInfo = evaluateMediaCrop(
      card.mediaDimensions,
      payload.mediaHeight,
      isCarousel,
      payload.cardWidth
    );

    const smsAnalysis = analyzeSmsSegments(payload.smsFallbackText || card.description || '');

    this.root.innerHTML = `
      <div class="rcs-chooser-shell">
        <!-- Compact Top Header: Preset Selector + Sub-navigation -->
        <div class="rcs-chooser-topbar">
          <div class="rcs-module-title">
            <span class="rcs-module-badge">MODULE 1</span>
            <h2>Template & Content Chooser</h2>
            ${renderDocLink(RCS_DOCS.overview.url, 'Official Google RBM Developer Documentation')}
          </div>

          <div class="rcs-preset-bar" title="Load authentic campaign presets from real screenshots">
            <label for="rcs-preset-select" class="rcs-sr-only">Preset</label>
            <select id="rcs-preset-select" class="rcs-select-compact">
              ${Object.values(REAL_CAMPAIGN_PRESETS).map((p) => `
                <option value="${p.id}" ${p.id === activePresetId ? 'selected' : ''}>★ Preset: ${p.label}</option>
              `).join('')}
            </select>
          </div>
        </div>

        <!-- 1. Pictogram Template Strip (Always visible for 1-click switching) -->
        <div class="rcs-template-strip" role="listbox" aria-label="RCS Rich Card Templates">
          ${TEMPLATES.map((tpl) => {
            const active = tpl.id === payload.templateId;
            return `
              <button type="button"
                class="rcs-tpl-btn ${active ? 'is-active' : ''}"
                data-tpl-id="${tpl.id}"
                role="option"
                aria-selected="${active}"
                title="${tpl.description}">
                <div class="rcs-tpl-btn-top">
                  ${getIcon(tpl.icon, 'rcs-tpl-ico')}
                  ${renderDocLink(tpl.docUrl, `${tpl.name} — Official Spec`)}
                </div>
                <span class="rcs-tpl-name">${tpl.shortName}</span>
              </button>
            `;
          }).join('')}
        </div>

        <!-- Secondary Mode Tabs (Content & Crop | Agent Brand | SMS Fallback & Flow | JSON Payload) -->
        <div class="rcs-subtabs" role="tablist">
          <button type="button" class="rcs-subtab ${activeSubTab === 'content' ? 'is-active' : ''}" data-subtab="content">
            ${getIcon('crop')} <span>Card & Media Specs</span>
          </button>
          <button type="button" class="rcs-subtab ${activeSubTab === 'agent' ? 'is-active' : ''}" data-subtab="agent">
            ${getIcon('verified')} <span>Agent Branding</span>
            <span class="rcs-dot ${agentDetected ? 'is-detected' : 'is-fallback'}" title="${agentDetected ? 'Agent branding detected' : 'Using fallback generic brand'}"></span>
          </button>
          <button type="button" class="rcs-subtab ${activeSubTab === 'fallback' ? 'is-active' : ''}" data-subtab="fallback">
            ${getIcon('sms')} <span>SMS Fallback & Flow</span>
          </button>
          <button type="button" class="rcs-subtab ${activeSubTab === 'json' ? 'is-active' : ''}" data-subtab="json">
            ${getIcon('code')} <span>RBM JSON</span>
          </button>
        </div>

        <!-- Tab Body (Scrollable internally within 720p layout) -->
        <div class="rcs-chooser-body">
          ${activeSubTab === 'content' ? this.renderContentTab({
            payload,
            card,
            currentTemplate,
            isMulti,
            isCarousel,
            isHorizontal,
            isTextOnly,
            isSms,
            cropInfo,
            showCropGuides,
            activeCardIndex
          }) : ''}

          ${activeSubTab === 'agent' ? this.renderAgentTab({ agent, agentDetected }) : ''}

          ${activeSubTab === 'fallback' ? this.renderFallbackTab({ payload, card, smsAnalysis }) : ''}

          ${activeSubTab === 'json' ? this.renderJsonTab({ payload, agent }) : ''}
        </div>
      </div>
    `;
  }

  renderContentTab({
    payload,
    card,
    isMulti,
    isCarousel,
    isHorizontal,
    isTextOnly,
    isSms,
    cropInfo,
    showCropGuides,
    activeCardIndex
  }) {
    const sizeKb = card.mediaSizeKb || 320;
    const maxKb = card.mediaType === 'video'
      ? cropInfo.spec.maxVideoKb
      : card.mediaType === 'gif'
        ? cropInfo.spec.maxGifKb
        : cropInfo.spec.maxImageKb;
    const sizeOk = sizeKb <= maxKb;

    return `
      <!-- Multi-Card Switcher (when Carousel or Stacked Multi-Card is active) -->
      ${isMulti ? `
        <div class="rcs-card-switcher">
          <div class="rcs-card-pills">
            ${payload.cards.map((c, idx) => `
              <button type="button" class="rcs-card-pill ${idx === activeCardIndex ? 'is-active' : ''}" data-card-idx="${idx}">
                #${idx + 1} ${this.escapeHtml((c.title || 'Card').slice(0, 14))}
              </button>
            `).join('')}
          </div>
          <div class="rcs-card-actions">
            <button type="button" class="rcs-icon-btn" id="rcs-add-card-btn" title="Add Card (max 10 in Carousel)" ${payload.cards.length >= 10 ? 'disabled' : ''}>
              ${getIcon('plus')} <span>Card</span>
            </button>
            ${payload.cards.length > 2 ? `
              <button type="button" class="rcs-icon-btn is-danger" id="rcs-del-card-btn" title="Remove active card">
                ${getIcon('trash')}
              </button>
            ` : ''}
          </div>
        </div>
      ` : ''}

      <!-- Geometry & Media Crop Section (Hidden in pure text/SMS mode) -->
      ${(!isTextOnly && !isSms) ? `
        <div class="rcs-panel-section">
          <div class="rcs-section-head">
            <span class="rcs-section-title">
              ${getIcon('crop')} Media Geometry & Safe-Zone Crop
              ${renderDocLink(RCS_DOCS.media.url, 'Official Media Sizes, Heights & Center-Crop Spec')}
            </span>
            <label class="rcs-toggle-pill" title="Highlight cropped vs visible zones on the preview">
              <input type="checkbox" id="rcs-crop-guide-toggle" ${showCropGuides ? 'checked' : ''}/>
              <span>Show Crop Overlay</span>
            </label>
          </div>

          <div class="rcs-geometry-grid">
            ${!isHorizontal ? `
              <div class="rcs-field-group">
                <label class="rcs-field-label">
                  Media Height (dp) ${renderDocLink(RCS_DOCS.richCards.url, 'CardMedia.Height: SHORT (112dp), MEDIUM (168dp), TALL (264dp)')}
                </label>
                <div class="rcs-segmented">
                  ${['SHORT', 'MEDIUM', 'TALL'].map((hKey) => `
                    <button type="button" class="rcs-seg-btn ${payload.mediaHeight === hKey ? 'is-active' : ''}" data-media-height="${hKey}">
                      <strong>${hKey}</strong>
                      <small>${MEDIA_SPECS[hKey].dpHeight}dp</small>

                  `).join('')}
                </div>
              </div>
            ` : `
              <div class="rcs-field-group">
                <label class="rcs-field-label">
                  Thumbnail Side ${renderDocLink(RCS_DOCS.richCards.url, 'Horizontal Rich Card ThumbnailAlignment')}
                </label>
                <div class="rcs-segmented">
                  ${['LEFT', 'RIGHT'].map((side) => `
                    <button type="button" class="rcs-seg-btn ${payload.thumbnailAlignment === side ? 'is-active' : ''}" data-thumb-align="${side}">
                      <strong>${side}</strong>
                      <small>128dp</small>
                    </button>
                  `).join('')}
                </div>
              </div>
            `}

            ${isCarousel ? `
              <div class="rcs-field-group">
                <label class="rcs-field-label">
                  Carousel Width ${renderDocLink(RCS_DOCS.carousels.url, 'CarouselCard.CardWidth: SMALL (120dp) or MEDIUM (200dp)')}

                <div class="rcs-segmented">
                  ${['SMALL', 'MEDIUM'].map((wKey) => `
                    <button type="button" class="rcs-seg-btn ${payload.cardWidth === wKey ? 'is-active' : ''}" data-card-width="${wKey}">
                      <strong>${wKey}</strong>
                      <small>${CAROUSEL_WIDTH_SPECS[wKey].rawSpecDp}dp</small>
                    </button>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>

          <!-- Interactive Crop & File Size Diagnostic Box -->
          <div class="rcs-crop-diagnostic">
            <div class="rcs-crop-minimap" title="Visual representation of how RCS center-crops your media">
              <div class="rcs-crop-stage" style="aspect-ratio: ${cropInfo.srcW} / ${cropInfo.srcH}; background-image: url('${card.mediaUrl}')">
                <div class="rcs-crop-mask is-${cropInfo.cropAxis}" style="
                  ${cropInfo.cropAxis === 'horizontal'
                    ? `width: ${Math.round(cropInfo.visibleFraction * 100)}%; height: 100%;`
                    : cropInfo.cropAxis === 'vertical'
                      ? `width: 100%; height: ${Math.round(cropInfo.visibleFraction * 100)}%;`
                      : 'width: 100%; height: 100%;'}
                ">
                  <span class="rcs-crop-safe-tag">SAFE VISIBLE ZONE</span>
                </div>
              </div>
            </div>

            <div class="rcs-crop-stats">
              <div class="rcs-spec-pill">
                <span class="rcs-spec-k">Rec. Size:</span>
                <strong class="rcs-spec-v">${cropInfo.recText}</strong>
              </div>
              <div class="rcs-spec-pill">
                <span class="rcs-spec-k">Current Asset:</span>
                <strong class="rcs-spec-v ${sizeOk ? 'is-ok' : 'is-warn'}">
                  ${cropInfo.srcW}×${cropInfo.srcH} px • ${sizeKb} KB (${(card.mediaType || 'image').toUpperCase()})
                </strong>
              </div>
              <div class="rcs-spec-pill">
                <span class="rcs-spec-k">Center-Crop:</span>
                <strong class="rcs-spec-v ${cropInfo.croppedPercent > 20 ? 'is-warn' : 'is-ok'}">
                  ${cropInfo.croppedPercent === 0
                    ? 'Exact aspect match (0% cropped)'
                    : `${cropInfo.croppedPercent}% cropped (${cropInfo.cropAxis === 'horizontal' ? 'left/right edges' : 'top/bottom edges'})`}
                </strong>
              </div>

              <div class="rcs-upload-row">
                <label class="rcs-upload-btn">
                  ${getIcon('upload')} <span>Upload Image / GIF / MP4</span>
                  <input type="file" id="rcs-media-file-input" accept="image/*,video/mp4,video/webm" hidden />
                </label>
                <button type="button" class="rcs-btn-ghost" id="rcs-sample-gif-btn" title="Load animated GIF/Video simulation">
                  ${getIcon('play')} <span>Demo Animated Media</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      ` : ''}

      <!-- Text Recommendations & Content Inputs -->
      <div class="rcs-panel-section">
        <div class="rcs-section-head">
          <span class="rcs-section-title">
            Text & Copy Recommendations
            ${renderDocLink(RCS_DOCS.richCards.url, 'Title (max 200 chars) & Description (max 2,000 chars)')}
          </span>
        </div>

        ${!isTextOnly && !isSms ? `
          <div class="rcs-field-group">
            <div class="rcs-label-row">
              <label for="rcs-card-title" class="rcs-field-label">
                Card Title ${renderDocLink(TEXT_LIMITS.title.docUrl, TEXT_LIMITS.title.hint)}
              </label>
              <span class="rcs-micro-hint">Rec ≤ 40 chars (max 200)</span>
            </div>
            <input type="text" id="rcs-card-title" class="rcs-input" value="${this.escapeHtml(card.title)}" maxlength="220" placeholder="Enter headline..." />
            ${this.renderCharMeter(card.title, TEXT_LIMITS.title)}
          </div>
        ` : ''}

        <div class="rcs-field-group">
          <div class="rcs-label-row">
            <label for="rcs-card-desc" class="rcs-field-label">
              ${isSms ? 'SMS Message Body' : isTextOnly ? 'RCS Message Text' : 'Card Description'}
              ${renderDocLink(isSms ? TEXT_LIMITS.smsFallback.docUrl : TEXT_LIMITS.description.docUrl, isSms ? TEXT_LIMITS.smsFallback.hint : TEXT_LIMITS.description.hint)}
            </label>
            <span class="rcs-micro-hint">${isSms ? '160 GSM-7 / 70 Unicode' : 'Rec ≤ 140 chars before fold'}</span>
          </div>
          <textarea id="rcs-card-desc" class="rcs-textarea" rows="3" placeholder="Enter message description...">${this.escapeHtml(card.description)}</textarea>
          ${this.renderCharMeter(card.description, isSms ? { recommended: 160, max: 320 } : TEXT_LIMITS.description)}
        </div>
      </div>

      <!-- Suggested Replies & Actions (Up to 4 per card) -->
      ${!isSms ? `
        <div class="rcs-panel-section">
          <div class="rcs-section-head">
            <span class="rcs-section-title">
              Suggested Actions & Replies (${(card.suggestions || []).length}/4)
              ${renderDocLink(RCS_DOCS.suggestedActions.url, 'Up to 4 Suggested Actions / Replies per card (max 25 chars each)')}
            </span>
            <button type="button" class="rcs-icon-btn" id="rcs-add-suggestion-btn" ${(card.suggestions || []).length >= 4 ? 'disabled' : ''}>
              ${getIcon('plus')} <span>Add Action</span>
            </button>
          </div>

          <div class="rcs-suggestions-list">
            ${(card.suggestions || []).map((sug, sIdx) => {
              const sugLen = Array.from(sug.text || '').length;
              const isOver = sugLen > TEXT_LIMITS.suggestionText.max;
              return `
                <div class="rcs-sug-row" data-sug-idx="${sIdx}">
                  <select class="rcs-sug-type" data-sug-idx="${sIdx}" title="Action Type">
                    ${Object.values(ACTION_TYPES).map((a) => `
                      <option value="${a.id}" ${sug.type === a.id ? 'selected' : ''}>${a.label}</option>
                    `).join('')}
                  </select>
                  <div class="rcs-sug-input-wrap">
                    <input type="text" class="rcs-input rcs-sug-text" data-sug-idx="${sIdx}" value="${this.escapeHtml(sug.text)}" placeholder="Button label (≤25 chars)" />
                    <span class="rcs-sug-counter ${isOver ? 'is-danger' : sugLen > 20 ? 'is-warn' : ''}" title="Max 25 chars">${sugLen}/25</span>
                  </div>
                  <input type="text" class="rcs-input rcs-sug-val" data-sug-idx="${sIdx}" value="${this.escapeHtml(sug.value || '')}" placeholder="URL / Phone / Payload" />
                  ${renderDocLink(ACTION_TYPES[sug.type]?.docUrl || RCS_DOCS.suggestedActions.url, `${ACTION_TYPES[sug.type]?.label || 'Action'} API Spec`)}
                  <button type="button" class="rcs-sug-del" data-sug-idx="${sIdx}" title="Remove button">${getIcon('trash')}</button>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      ` : ''}
    `;
  }

  renderAgentTab({ agent, agentDetected }) {
    return `
      <div class="rcs-panel-section">
        <div class="rcs-section-head">
          <span class="rcs-section-title">
            ${getIcon('verified')} RBM Agent Identity & Brand Detection
            ${renderDocLink(RCS_DOCS.agentInfo.url, 'Official Google RBM Agent Brand & Verification Spec')}
          </span>
          <div class="rcs-agent-detect-actions">
            <button type="button" class="rcs-btn-ghost" id="rcs-simulate-missing-agent" title="Test fallback when agent brand info is not detected">
              ${agentDetected ? 'Simulate Missing Agent' : 'Restore Detected Agent'}
            </button>
          </div>
        </div>

        <div class="rcs-agent-banner ${agentDetected ? 'is-detected' : 'is-fallback'}">
          <span>${agentDetected
            ? '✓ Brand metadata & colors synced from RBM Agent profile.'
            : '⚠ Agent metadata not detected — using customizable generic preview fallback.'}</span>
        </div>

        <div class="rcs-agent-grid">
          <div class="rcs-field-group">
            <label class="rcs-field-label" for="rcs-agent-name">
              Brand / Agent Display Name ${renderDocLink(RCS_DOCS.agentInfo.url, 'Agent Display Name shown in top bar & profile header')}
            </label>
            <input type="text" id="rcs-agent-name" class="rcs-input" value="${this.escapeHtml(agent.name)}" />
          </div>

          <div class="rcs-field-group">
            <label class="rcs-field-label" for="rcs-agent-color">
              Brand Color & Avatar Shape ${renderDocLink(RCS_DOCS.agentInfo.url, 'Agent hex color & logo styling')}
            </label>
            <div class="rcs-color-row">
              <input type="color" id="rcs-agent-color" class="rcs-color-picker" value="${agent.color || '#D61F26'}" />
              <input type="text" id="rcs-agent-color-hex" class="rcs-input rcs-hex-input" value="${this.escapeHtml(agent.color || '#D61F26')}" />
              <select id="rcs-agent-shape" class="rcs-select-compact">
                <option value="rounded" ${agent.avatarShape === 'rounded' ? 'selected' : ''}>Rounded Square</option>
                <option value="circle" ${agent.avatarShape === 'circle' ? 'selected' : ''}>Circle Avatar</option>
              </select>
            </div>
          </div>
        </div>

        <div class="rcs-field-group">
          <label class="rcs-field-label" for="rcs-agent-tagline">Agent Description / Tagline (shown in top profile header)</label>
          <input type="text" id="rcs-agent-tagline" class="rcs-input" value="${this.escapeHtml(agent.tagline || '')}" />
        </div>

        <div class="rcs-upload-row">
          <label class="rcs-upload-btn">
            ${getIcon('upload')} <span>Upload Brand Logo (Auto-Extracts Color)</span>
            <input type="file" id="rcs-agent-logo-input" accept="image/*" hidden />
          </label>
          <label class="rcs-toggle-pill">
            <input type="checkbox" id="rcs-agent-verified" ${agent.verified ? 'checked' : ''} />
            <span>Verified Badge</span>
          </label>
        </div>

        <div class="rcs-section-head" style="margin-top:8px">
          <span class="rcs-section-title">Real Conversation Chrome Toggles (from Screenshots)</span>
        </div>
        <div class="rcs-chrome-toggles">
          <label class="rcs-toggle-pill">
            <input type="checkbox" id="rcs-show-agent-header" ${agent.showAgentHeader ? 'checked' : ''} />
            <span>Large Profile Header (TIPOS style)</span>
          </label>
          <label class="rcs-toggle-pill">
            <input type="checkbox" id="rcs-show-rbm-notice" ${agent.showRbmChatNotice !== false ? 'checked' : ''} />
            <span>"This is an RCS for Business chat."</span>
          </label>
          <label class="rcs-toggle-pill">
            <input type="checkbox" id="rcs-show-spam-banner" ${agent.showSpamBanner ? 'checked' : ''} />
            <span>"block & report" Shield Banner (Telekom style)</span>
          </label>
          <label class="rcs-toggle-pill">
            <input type="checkbox" id="rcs-show-scroll-btn" ${agent.showScrollDownBtn ? 'checked' : ''} />
            <span>Floating Scroll-Down ↓ Button</span>
          </label>
        </div>
      </div>
    `;
  }

  renderFallbackTab({ payload, smsAnalysis }) {
    return `
      <div class="rcs-panel-section">
        <div class="rcs-section-head">
          <span class="rcs-section-title">
            ${getIcon('sms')} SMS Fallback System & Segment Calculator
            ${renderDocLink(RCS_DOCS.fallback.url, 'Official RCS-to-SMS Fallback & Revoke API Spec')}
          </span>
          <button type="button" class="rcs-btn-ghost" id="rcs-autogenerate-fallback">
            Auto-Generate from Rich Card
          </button>
        </div>

        <div class="rcs-field-group">
          <label class="rcs-field-label" for="rcs-fallback-text">
            Fallback SMS Text (sent automatically when recipient device is offline or lacks RCS)
          </label>
          <textarea id="rcs-fallback-text" class="rcs-textarea" rows="3">${this.escapeHtml(payload.smsFallbackText || '')}</textarea>
          <div class="rcs-sms-stats">
            <span class="rcs-sms-pill">Encoding: <strong>${smsAnalysis.encoding}</strong></span>
            <span class="rcs-sms-pill">Length: <strong>${smsAnalysis.length} chars</strong></span>
            <span class="rcs-sms-pill ${smsAnalysis.segments > 1 ? 'is-warn' : 'is-ok'}">
              Segments: <strong>${smsAnalysis.segments} SMS</strong> (${smsAnalysis.remaining} chars left in segment)
            </span>
          </div>
        </div>
      </div>

      <div class="rcs-panel-section">
        <div class="rcs-section-head">
          <span class="rcs-section-title">
            ${getIcon('play')} Interactive Conversation & Animation Simulator
          </span>
        </div>
        <p class="rcs-micro-copy">
          Test how bubbles, typing indicators, user taps, and rich cards animate in real time inside the phone preview.
        </p>
        <div class="rcs-flow-buttons">
          <button type="button" class="rcs-btn-primary" data-flow-action="play-full-conversation">
            ${getIcon('play')} Simulate Animated Conversation Flow
          </button>
          <button type="button" class="rcs-btn-ghost" data-flow-action="push-user-msg">
            + User Bubble ("Chcem ponuku")
          </button>
          <button type="button" class="rcs-btn-ghost" data-flow-action="toggle-sms-fallback-view">
            ⇄ Toggle SMS Fallback View in Phone
          </button>
        </div>
      </div>
    `;
  }

  renderJsonTab({ payload, agent }) {
    const card = this.getCurrentCard();
    const rbmPayload = {
      contentMessage: payload.templateId === 'carousel'
        ? {
            richCard: {
              carouselCard: {
                cardWidth: payload.cardWidth || 'MEDIUM',
                cardContents: payload.cards.map((c) => ({
                  title: c.title,
                  description: c.description,
                  media: {
                    height: payload.mediaHeight || 'TALL',
                    contentInfo: { fileUrl: c.mediaUrl.slice(0, 64) + '...', forceRefresh: false }
                  },
                  suggestions: (c.suggestions || []).map((s) => ({
                    [s.type === 'reply' ? 'reply' : 'action']: {
                      text: s.text,
                      postbackData: s.value || s.text
                    }
                  }))
                }))
              }
            }
          }
        : {
            richCard: {
              standaloneCard: {
                cardOrientation: payload.templateId === 'standalone_horizontal' ? 'HORIZONTAL' : 'VERTICAL',
                ...(payload.templateId === 'standalone_horizontal'
                  ? { thumbnailImageAlignment: payload.thumbnailAlignment || 'LEFT' }
                  : {}),
                cardContent: {
                  title: card.title,
                  description: card.description,
                  media: {
                    height: payload.mediaHeight || 'TALL',
                    contentInfo: { fileUrl: card.mediaUrl.slice(0, 64) + '...', forceRefresh: false }
                  },
                  suggestions: (card.suggestions || []).map((s) => ({
                    [s.type === 'reply' ? 'reply' : 'action']: {
                      text: s.text,
                      postbackData: s.value || s.text
                    }
                  }))
                }
              }
            }
          },
      agentInfo: {
        displayName: agent.name,
        verified: agent.verified,
        brandColor: agent.color
      },
      fallbackSms: payload.smsFallbackText
    };

    return `
      <div class="rcs-panel-section">
        <div class="rcs-section-head">
          <span class="rcs-section-title">
            ${getIcon('code')} Google RBM API Payload (v1/phones.agentMessages)
            ${renderDocLink(RCS_DOCS.restReference.url, 'Official AgentContentMessage REST Reference')}
          </span>
          <button type="button" class="rcs-btn-ghost" id="rcs-copy-json-btn">Copy JSON</button>
        </div>
        <pre class="rcs-json-pre"><code>${this.escapeHtml(JSON.stringify(rbmPayload, null, 2))}</code></pre>
      </div>
    `;
  }

  attachEvents() {
    // Preset switcher
    const presetSelect = this.root.querySelector('#rcs-preset-select');
    if (presetSelect) {
      presetSelect.addEventListener('change', (e) => this.loadPreset(e.target.value));
    }

    // Template strip buttons
    this.root.querySelectorAll('[data-tpl-id]').forEach((btn) => {
      btn.addEventListener('click', () => this.selectTemplate(btn.dataset.tplId));
    });

    // Subtabs
    this.root.querySelectorAll('[data-subtab]').forEach((btn) => {
      btn.addEventListener('click', () => {
        this.state.activeSubTab = btn.dataset.subtab;
        this.render();
        this.attachEvents();
      });
    });

    // Multi-card switcher pills
    this.root.querySelectorAll('[data-card-idx]').forEach((btn) => {
      btn.addEventListener('click', () => {
        this.state.activeCardIndex = Number(btn.dataset.cardIdx);
        this.render();
        this.attachEvents();
        this.emitChange('card-switch');
      });
    });

    const addCardBtn = this.root.querySelector('#rcs-add-card-btn');
    if (addCardBtn) {

    const delCardBtn = this.root.querySelector('#rcs-del-card-btn');

        this.state.payload.cards.splice(this.state.activeCardIndex, 1);

    this.root.querySelectorAll('[data-media-height]').forEach((btn) => {

        this.attachEvents();

        this.emitChange('thumb-align');
      });

    this.root.querySelectorAll('[data-card-width]').forEach((btn) => {
      btn.addEventListener('click', () => {

        this.attachEvents();
        this.emitChange('card-width');

    const cropToggle = this.root.querySelector('#rcs-crop-guide-toggle');
    if (cropToggle) {

        const isGif = file.type === 'image/gif';
        card.mediaType = isVideo ? 'video' : isGif ? 'gif' : 'image';

        const reader = new FileReader();
        reader.onload = () => {
          card.mediaUrl = reader.result;
          if (!isVideo) {
            const img = new Image();
            img.onload = () => {
              card.mediaDimensions = { width: img.naturalWidth || 1200, height: img.naturalHeight || 800 };
              this.render();
              this.attachEvents();
              this.emitChange('media-upload');
            };
            img.src = reader.result;
          } else {
            card.mediaDimensions = { width: 1280, height: 720 };

            <animate attributeName="opacity" values="0.3;0.08;0.3" dur="2.6s" repeatCount="indefinite"/>
          </circle>

          <text x="600" y="425" fill="#ffffff" font-family="system-ui, sans-serif" font-size="68" font-weight="900" text-anchor="middle">⚡ LIVE ANIMATED GIF</text>
          <text x="600" y="515" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="40" font-weight="700" text-anchor="middle">Auto-Plays Inline in RCS Chat</text>

    this.root.querySelectorAll('.rcs-sug-text').forEach((inp) => {

    this.root.querySelectorAll('.rcs-sug-del').forEach((btn) => {
      btn.addEventListener('click', () => {

    const agentName = this.root.querySelector('#rcs-agent-name');
    if (agentName) {
      agentName.addEventListener('input', (e) => {
